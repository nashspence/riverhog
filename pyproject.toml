[tool.uv.workspace]
members = [
  "packages/*",
  "some-implementations/gogurt/application",
  "some-implementations/gogurt/listener-host/*",
  "some-implementations/gogurt/mounted-volume/*",
  "some-implementations/gogurt/packages/*",
  "some-implementations/riverhog/applications/*",
  "some-implementations/riverhog/packages/*",
  "some-implementations/riverhog/ingress/*",
  "some-implementations/riverhog/provenance/contracts/*",
  "some-implementations/riverhog/provenance/observers/*",
  "some-implementations/riverhog/recovery",
  "some-implementations/riverhog/storage/*",
  "some-implementations/stove0/application/client",
  "some-implementations/stove0/application/server",
  "some-implementations/stove0/observers/exiftool",
  "some-implementations/stove0/observers/ffprobe-sampling",
  "some-implementations/stove0/observers/contracts/*",
  "some-implementations/stove0/targets/media-archive/*",
  "some-implementations/stove0/review0/contracts",
  "some-implementations/stove0/review0/materialize-target",
  "some-implementations/stove0/review0/planning",
  "some-implementations/stove0/review0/rclone-effect-target",
  "some-implementations/stove0/review0/support",
  "some-implementations/stove0/review0/sampler/*",
  "some-implementations/stove0/review0/samplers/*",
  "some-implementations/stove0/targets/*/target",
  "some-implementations/stove0/packages/*",
  "riverhog",
]

[tool.uv.sources]
gogurt-core = { workspace = true }
gogurt-listener-runtime = { workspace = true }
a-gogurt-path-volume-lib = { workspace = true }
a-gogurt-linux-listener = { workspace = true }
a-gogurt-linux-volume = { workspace = true }
a-gogurt-macos-listener = { workspace = true }
a-gogurt-macos-volume = { workspace = true }
a-gogurt-windows-listener = { workspace = true }
a-gogurt-windows-volume = { workspace = true }
a-riverhog-ftp-spool-client = { workspace = true }
a-riverhog-witness-contract-lib = { workspace = true }
riverhog-archive-contracts = { workspace = true }
riverhog-canonical-json = { workspace = true }
riverhog-provenance = { workspace = true }
riverhog-provenance-contracts = { workspace = true }
a-riverhog-linux-provenance-contract-lib = { workspace = true }
a-riverhog-linux-provenance-observer = { workspace = true }
a-riverhog-macos-provenance-contract-lib = { workspace = true }
a-riverhog-macos-provenance-observer = { workspace = true }
a-riverhog-windows-provenance-contract-lib = { workspace = true }
a-riverhog-windows-provenance-observer = { workspace = true }
riverhog-storage-adapter-asgi-support = { workspace = true }
riverhog-storage-adapter-protocol = { workspace = true }
a-riverhog-s3-store-lib = { workspace = true }
riverhog-storage-adapter-support = { workspace = true }
riverhog-client = { workspace = true }
stove0-api-client = { workspace = true }
a-stove0-media-archive-contract-lib = { workspace = true }
a-stove0-media-archive-lib = { workspace = true }
a-stove0-media-metadata-contract-lib = { workspace = true }
a-stove0-media-sampling-contract-lib = { workspace = true }
stove0-observer-client = { workspace = true }
stove0-protocol = { workspace = true }
stove0-recipe-config = { workspace = true }
stove0-observer-protocol = { workspace = true }
stove0-observer-support = { workspace = true }
stove0-operator-contracts = { workspace = true }
review0-planner = { workspace = true }
a-review0-materializer = { workspace = true }
a-review0-rclone-target = { workspace = true }
review0-target-contracts = { workspace = true }
review0-target-lib = { workspace = true }
review0-sampler-client = { workspace = true }
review0-sampler-protocol = { workspace = true }
review0-sampler-lib = { workspace = true }
stove0-target-client = { workspace = true }
stove0-target-protocol = { workspace = true }
stove0-target-support = { workspace = true }
time-formats = { workspace = true }

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.43.59,<2.0",
  "httpx2>=2,<3",
  "license-expression>=30.4,<31",
  "mypy>=2.3.0,<3.0",
  "packaging>=26,<27",
  "psycopg[binary]>=3.3.4,<4.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=7.1.0,<8.0",
  "pytest-xdist>=3.8,<4",
  "rfc8785>=0.1.4,<0.2",
  "reuse>=6,<7",
  "ruff>=0.16.0,<1.0",
  "types-jsonschema>=4.25,<5.0",
  "types-PyYAML>=6.0,<7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
testpaths = ["packages", "some-implementations", "riverhog", "tests"]
markers = [
  "integration: requires explicitly provisioned integration infrastructure",
]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "a_riverhog_linux_provenance_observer"
# OSError.errno is typed as optional even on the caught native failures whose
# numeric code is preserved for diagnostic rendering.
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "a_riverhog_macos_provenance_observer"
# The non-Darwin host stubs cannot express Darwin errno and native ABI details;
# live macOS CI qualifies the implementation itself.
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "a_riverhog_windows_provenance_observer"
# The non-Windows host stubs intentionally omit ctypes/msvcrt/winreg members;
# live Windows CI qualifies those APIs and their independently typed wrappers.
disable_error_code = ["attr-defined"]
