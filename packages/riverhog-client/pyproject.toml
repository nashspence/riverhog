[build-system]
requires = ["hatchling>=1.31.0", "setuptools==84.2.1; sys_platform == 'win32'"]
build-backend = "hatchling.build"

[project]
name = "riverhog-client"
version = "0.1.0"
description = "Typed generic Riverhog client and capability-scoped collection-processing runtime."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Typed generic Riverhog client and capability-scoped collection-processing runtime.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = ["release-documentation-lib>=0.1,<0.2",
  "riverhog-archive-contracts>=0.1,<0.2",
  "riverhog-application-access>=0.1,<0.2",
  "http-api-contracts>=0.1,<0.2",
  "httpx[http2]>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "riverhog-protocol>=0.1,<0.2",
  "riverhog-canonical-json>=0.1,<0.2",
  "riverhog-growth-contracts>=0.1,<0.2",
  "riverhog-provenance-contracts>=0.1,<0.2",
  "riverhog-provenance>=0.1,<0.2",
  "time-formats>=0.1,<0.2",
  "state-schema>=0.1,<0.2",
  "alembic>=1.18.5,<2.0",
  "SQLAlchemy>=2.0,<3.0",
]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "hatch_build.py" },
  { file = "native/*.c" },
  { file = "native/*.h" },
  { dir = "src" },
]

[tool.uv.sources]
release-documentation-lib = { workspace = true }
riverhog-archive-contracts = { workspace = true }
riverhog-application-access = { workspace = true }
http-api-contracts = { workspace = true }
riverhog-protocol = { workspace = true }
riverhog-canonical-json = { workspace = true }
riverhog-growth-contracts = { workspace = true }
riverhog-provenance-contracts = { workspace = true }
riverhog-provenance = { workspace = true }
time-formats = { workspace = true }
state-schema = { workspace = true }

[tool.riverhog.public-api]
modules = ["riverhog_client", "riverhog_client.processing"]

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_client"]


[tool.hatch.build.targets.wheel.hooks.custom]
native-platforms = ["win32"]

[tool.hatch.build.targets.sdist]
include = ["src", "native", "hatch_build.py", "pyproject.toml", "LICENSE"]
