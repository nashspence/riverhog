[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-protocol"
version = "0.1.0"
description = "Canonical Riverhog wire and identity contracts."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Canonical Riverhog wire and identity contracts.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "http-api-contracts>=0.1,<0.2",
  "lifecycle-events>=0.1,<0.2",
  "pydantic>=2.12,<3.0",
  "riverhog-archive-contracts>=0.1,<0.2",
  "riverhog-canonical-json>=0.1,<0.2",
  "riverhog-provenance-contracts>=0.1,<0.2",
  "time-formats>=0.1,<0.2",
]

[project.entry-points."riverhog.provenance-contracts"]
collection-production = "riverhog_protocol.collection_production_provenance:CONTRACT_BINDING"

[tool.uv.sources]
http-api-contracts = { workspace = true }
lifecycle-events = { workspace = true }
riverhog-archive-contracts = { workspace = true }
riverhog-canonical-json = { workspace = true }
riverhog-provenance-contracts = { workspace = true }
time-formats = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_protocol"]

[tool.hatch.build.targets.wheel.shared-data]
"schemas" = "share/riverhog-protocol/schemas"
