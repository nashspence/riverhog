[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-storage-adapter-protocol"
version = "0.1.0"
description = "Provider-neutral opaque-object capability contracts for Riverhog storage adapters."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Provider-neutral opaque-object capability contracts for Riverhog storage adapters.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = ["release-documentation-lib>=0.1,<0.2",
  "pydantic>=2.7,<3.0",
  "riverhog-canonical-json>=0.1,<0.2",
  "time-formats>=0.1,<0.2",
]

[tool.uv.sources]
release-documentation-lib = { workspace = true }
riverhog-canonical-json = { workspace = true }
time-formats = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_storage_adapter_protocol"]
