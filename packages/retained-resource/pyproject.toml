[build-system]
requires = ["hatchling>=1.31.0", "setuptools==84.2.1; sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32'"]
build-backend = "hatchling.build"

[project]
name = "retained-resource"
version = "0.1.0"
description = "Retained native file and POSIX directory receiving."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Retained native file and POSIX directory receiving.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = ["release-documentation-lib>=0.1,<0.2", "riverhog-growth-contracts>=0.1,<0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/retained_resource"]

[tool.uv.sources]
release-documentation-lib = { workspace = true }
riverhog-growth-contracts = { workspace = true }

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "hatch_build.py" },
  { file = "native/*.c" },
  { dir = "src" },
]

[tool.hatch.build.targets.wheel.hooks.custom]
native-platforms = ["linux", "darwin", "win32"]

[tool.hatch.build.targets.sdist]
include = ["src", "native", "hatch_build.py", "pyproject.toml", "LICENSE"]
