[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "riverhog-provenance"
version = "0.1.0"
description = "Path-independent opaque-artifact observations, provenance journals and application validation."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "jsonschema>=4.23,<5.0",
  "riverhog-canonical-json>=0.1,<0.2",
  "riverhog-provenance-contracts>=0.1,<0.2",
  "time-formats>=0.1,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "rdflib>=7,<8"]

[tool.uv.sources]
riverhog-canonical-json = { workspace = true }
riverhog-provenance-contracts = { workspace = true }
time-formats = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/riverhog_provenance"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "riverhog_provenance/NOTICE"
