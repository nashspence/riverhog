[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "a-riverhog-windows-provenance-contract-lib"
version = "0.1.0"
description = "Windows filesystem observation contracts for Riverhog provenance."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Windows filesystem observation contracts for Riverhog provenance.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = ["riverhog-provenance-contracts>=0.1,<0.2"]

[project.entry-points."riverhog.provenance-contracts"]
a-riverhog-windows-provenance-contract-lib = "a_riverhog_windows_provenance_contract_lib:CONTRACT_BINDING"

[tool.uv.sources]
riverhog-provenance-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/a_riverhog_windows_provenance_contract_lib"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "a_riverhog_windows_provenance_contract_lib/NOTICE"
