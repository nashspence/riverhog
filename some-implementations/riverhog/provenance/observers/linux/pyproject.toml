[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "a-riverhog-linux-provenance-observer"
version = "0.1.0"
description = "Linux filesystem observer for Riverhog provenance."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Linux filesystem observer for Riverhog provenance.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = ["Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Typing :: Typed"]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "riverhog-provenance>=0.1,<0.2",
  "a-riverhog-linux-provenance-contract-lib>=0.1,<0.2",
]

[project.entry-points."riverhog.provenance-observers"]
a-riverhog-linux-provenance-observer = "a_riverhog_linux_provenance_observer:OBSERVER_BINDING"

[tool.uv.sources]
riverhog-provenance = { workspace = true }
a-riverhog-linux-provenance-contract-lib = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/a_riverhog_linux_provenance_observer"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "a_riverhog_linux_provenance_observer/NOTICE"
