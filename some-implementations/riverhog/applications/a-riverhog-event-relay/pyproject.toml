[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "a-riverhog-event-relay"
version = "0.1.0"
description = "Native lifecycle-event to CloudEvents webhook relay."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Native lifecycle-event to CloudEvents webhook relay.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "alembic>=1.18.5,<2.0",
  "httpx>=0.27,<1.0",
  "lifecycle-events>=0.1,<0.2",
  "pydantic>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "state-schema>=0.1,<0.2",
  "SQLAlchemy>=2.0,<3.0",
]

[project.scripts]
a-riverhog-event-relay = "a_riverhog_event_relay.cli:main"

[tool.uv.sources]
lifecycle-events = { workspace = true }
state-schema = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/a_riverhog_event_relay"]
