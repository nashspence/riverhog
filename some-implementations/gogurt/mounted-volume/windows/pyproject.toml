[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "a-gogurt-windows-volume"
version = "0.1.0"
description = "Windows mounted-volume provider for Gogurt."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Windows mounted-volume provider for Gogurt.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = ["Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Typing :: Typed"]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "gogurt-core>=0.1,<0.2",
  "a-gogurt-path-volume-lib>=0.1,<0.2",
]

[project.entry-points."gogurt.mounted-volume-providers"]
a-gogurt-windows-volume = "a_gogurt_windows_volume:MOUNTED_VOLUME_PROVIDER_BINDING"

[tool.uv.sources]
gogurt-core = { workspace = true }
a-gogurt-path-volume-lib = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/a_gogurt_windows_volume"]
