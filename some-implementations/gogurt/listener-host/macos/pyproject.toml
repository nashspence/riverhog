[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "a-gogurt-macos-listener"
version = "0.1.0"
description = "macOS launchd listener for Gogurt."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "macOS launchd listener for Gogurt.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = ["Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Typing :: Typed"]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "gogurt-listener-runtime>=0.1,<0.2",
]

[project.entry-points."gogurt.listener-host-providers"]
a-gogurt-macos-listener = "a_gogurt_macos_listener:LISTENER_HOST_PROVIDER_BINDING"

[tool.uv.sources]
gogurt-listener-runtime = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/a_gogurt_macos_listener"]
