x-stove0-image: &stove0-image
  image: ${STOVE0_IMAGE_REF:-stove0:dev}
  build:
    context: ../../..
    dockerfile: some-implementations/stove0/application/server/Dockerfile
    target: bundled-components
    args:
      SOURCE_REVISION: ${SOURCE_REVISION:-unknown}

x-stove0-environment: &stove0-environment
  TZ: ${TZ:-UTC}
  STOVE0_CONFIG: /etc/stove0/config.yaml

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  user: "65532:65532"
  group_add:
    - "${STOVE0_SECRET_FILE_GID:-65532}"
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

x-stove0-common: &stove0-common
  <<: [*stove0-image, *hardening]
  volumes:
    - type: bind
      source: ${STOVE0_CONFIG_HOST_PATH:?STOVE0_CONFIG_HOST_PATH is required}
      target: /etc/stove0/config.yaml
      read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_TMPFS_SIZE:-1g}
  networks: ["stove0-internal", "riverhog-control"]

services:
  state:
    <<: *stove0-common
    restart: "no"
    command: ["stove0-server", "state", "upgrade"]
    environment:
      <<: *stove0-environment
    secrets: ["stove0_database_url"]

  api:
    <<: *stove0-common
    depends_on:
      state:
        condition: service_completed_successfully
    environment:
      <<: *stove0-environment
    secrets:
      - stove0_database_url
      - stove0_target_callback_signing_key
      - stove0_browse_token_signing_key
      - a_stove0_ffprobe_sampling_observer_token
      - a_stove0_exiftool_observer_token
      - a_stove0_nvenc_av1_opus_target_token
      - a_stove0_opus_target_token
      - a_review0_materializer_token
      - a_review0_rclone_target_token
      - stove0_api_token
      - source: stove0_api_riverhog_token
        target: stove0_riverhog_token
    ports:
      - "${STOVE0_API_BIND_ADDR:-127.0.0.1}:${STOVE0_API_PORT:-8094}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          payload = json.load(urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5));
          assert payload == {'service': 'stove0', 'status': 'ok'}
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  controller:
    <<: *stove0-common
    depends_on:
      state:
        condition: service_completed_successfully
    command: ["stove0-server", "scheduler", "--role", "controller"]
    environment:
      <<: *stove0-environment
    secrets:
      - stove0_database_url
      - stove0_target_callback_signing_key
      - stove0_browse_token_signing_key
      - a_stove0_ffprobe_sampling_observer_token
      - a_stove0_exiftool_observer_token
      - a_stove0_nvenc_av1_opus_target_token
      - a_stove0_opus_target_token
      - a_review0_materializer_token
      - a_review0_rclone_target_token
      - source: stove0_controller_riverhog_token
        target: stove0_riverhog_token

  worker:
    <<: *stove0-common
    depends_on:
      state:
        condition: service_completed_successfully
    command: ["stove0-server", "scheduler", "--role", "worker"]
    environment:
      <<: *stove0-environment
    secrets:
      - stove0_database_url
      - stove0_target_callback_signing_key
      - stove0_browse_token_signing_key
      - a_stove0_ffprobe_sampling_observer_token
      - a_stove0_exiftool_observer_token
      - a_stove0_nvenc_av1_opus_target_token
      - a_stove0_opus_target_token
      - a_review0_materializer_token
      - a_review0_rclone_target_token
      - source: stove0_worker_riverhog_token
        target: stove0_riverhog_token

  a-stove0-ffprobe-sampling-observer:
    <<: *hardening
    image: ${A_STOVE0_FFPROBE_SAMPLING_OBSERVER_IMAGE_REF:-a-stove0-ffprobe-sampling-observer:dev}
    build:
      context: ../../..
      dockerfile: some-implementations/stove0/observers/ffprobe-sampling/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    command: ["a-stove0-ffprobe-sampling-observer", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      A_STOVE0_FFPROBE_SAMPLING_OBSERVER_TOKEN_FILE: /run/secrets/a_stove0_ffprobe_sampling_observer_token
      A_STOVE0_FFPROBE_SAMPLING_OBSERVER_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      A_STOVE0_FFPROBE_SAMPLING_OBSERVER_IMAGE_ID: ${A_STOVE0_FFPROBE_SAMPLING_OBSERVER_IMAGE_ID:?A_STOVE0_FFPROBE_SAMPLING_OBSERVER_IMAGE_ID is required}
      A_STOVE0_FFPROBE_SAMPLING_OBSERVER_WORKSPACE: /run/a-stove0-ffprobe-sampling-observer
    secrets: ["a_stove0_ffprobe_sampling_observer_token"]
    networks: ["stove0-internal", "riverhog-control"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_TMPFS_SIZE:-1g}
      - /run/a-stove0-ffprobe-sampling-observer:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_OBSERVER_TMPFS_SIZE:-8g}
    healthcheck: &ffmpeg-health
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          payload = json.load(urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5));
          assert payload['status'] == 'ok'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  a-stove0-exiftool-observer:
    <<: *hardening
    image: ${A_STOVE0_EXIFTOOL_OBSERVER_IMAGE_REF:-a-stove0-exiftool-observer:dev}
    build:
      context: ../../..
      dockerfile: some-implementations/stove0/observers/exiftool/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    command: ["a-stove0-exiftool-observer", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      A_STOVE0_EXIFTOOL_OBSERVER_TOKEN_FILE: /run/secrets/a_stove0_exiftool_observer_token
      A_STOVE0_EXIFTOOL_OBSERVER_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      A_STOVE0_EXIFTOOL_OBSERVER_IMAGE_ID: ${A_STOVE0_EXIFTOOL_OBSERVER_IMAGE_ID:?A_STOVE0_EXIFTOOL_OBSERVER_IMAGE_ID is required}
      A_STOVE0_EXIFTOOL_OBSERVER_WORKSPACE: /run/a-stove0-exiftool-observer
    secrets: ["a_stove0_exiftool_observer_token"]
    networks: ["stove0-internal", "riverhog-control"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_TMPFS_SIZE:-1g}
      - /run/a-stove0-exiftool-observer:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_OBSERVER_TMPFS_SIZE:-8g}
    healthcheck: *ffmpeg-health

  a-stove0-opus-target:
    <<: *hardening
    image: ${A_STOVE0_OPUS_TARGET_IMAGE_REF:-a-stove0-opus-target:dev}
    build: &opus-build
      context: ../../..
      dockerfile: some-implementations/stove0/targets/opus/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    command: ["a-stove0-opus-target", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      A_STOVE0_OPUS_TARGET_TOKEN_FILE: /run/secrets/a_stove0_opus_target_token
      A_STOVE0_OPUS_TARGET_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      A_STOVE0_OPUS_TARGET_IMAGE_ID: ${A_STOVE0_OPUS_TARGET_IMAGE_ID:?A_STOVE0_OPUS_TARGET_IMAGE_ID is required}
      A_STOVE0_OPUS_TARGET_STATE_ROOT: /var/lib/a-stove0-opus-target
      A_STOVE0_OPUS_TARGET_WORKSPACE: /run/a-stove0-opus-target
      STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS: ${STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS:-2592000}
    secrets: ["a_stove0_opus_target_token"]
    networks: ["stove0-internal", "riverhog-control"]
    volumes:
      - a-stove0-opus-target-state:/var/lib/a-stove0-opus-target
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_TMPFS_SIZE:-1g}
      - /run/a-stove0-opus-target:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_TARGET_TMPFS_SIZE:-32g}
    healthcheck: *ffmpeg-health

  a-review0-opus-sampler:
    <<: *hardening
    image: ${A_STOVE0_OPUS_TARGET_IMAGE_REF:-a-stove0-opus-target:dev}
    build: *opus-build
    command: ["a-review0-opus-sampler", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      A_REVIEW0_OPUS_SAMPLER_TOKEN_FILE: /run/secrets/a_review0_opus_sampler_token
      A_REVIEW0_OPUS_SAMPLER_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      A_REVIEW0_OPUS_SAMPLER_IMAGE_ID: ${A_STOVE0_OPUS_TARGET_IMAGE_ID:?A_STOVE0_OPUS_TARGET_IMAGE_ID is required}
      A_REVIEW0_OPUS_SAMPLER_WORKSPACE: /run/review0
    secrets: ["a_review0_opus_sampler_token"]
    networks: ["review-sampler"]
    volumes:
      - review0-workspace:/run/review0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_TMPFS_SIZE:-1g}
    healthcheck: *ffmpeg-health

  a-review0-materializer:
    <<: *hardening
    image: ${A_REVIEW0_MATERIALIZER_IMAGE_REF:-a-review0-materializer:dev}
    build:
      context: ../../..
      dockerfile: some-implementations/stove0/review0/materialize-target/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    command: ["a-review0-materializer", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      A_REVIEW0_MATERIALIZER_CONFIG: /etc/review0/materializer.yaml
      A_REVIEW0_MATERIALIZER_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      A_REVIEW0_MATERIALIZER_IMAGE_ID: ${A_REVIEW0_MATERIALIZER_IMAGE_ID:?A_REVIEW0_MATERIALIZER_IMAGE_ID is required}
      A_REVIEW0_MATERIALIZER_STATE_ROOT: /var/lib/a-review0-materializer
      A_REVIEW0_MATERIALIZER_WORKSPACE: /run/review0
      STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS: ${STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS:-2592000}
    depends_on:
      a-review0-opus-sampler:
        condition: service_healthy
    secrets:
      - a_review0_materializer_token
      - a_review0_opus_sampler_token
    networks: ["stove0-internal", "riverhog-control", "review-sampler"]
    volumes:
      - type: bind
        source: ${A_REVIEW0_MATERIALIZER_CONFIG_HOST_PATH:?A_REVIEW0_MATERIALIZER_CONFIG_HOST_PATH is required}
        target: /etc/review0/materializer.yaml
        read_only: true
      - a-review0-materializer-state:/var/lib/a-review0-materializer
      - review0-workspace:/run/review0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_TMPFS_SIZE:-1g}
    healthcheck: *ffmpeg-health

  a-review0-rclone-target:
    <<: *hardening
    image: ${A_REVIEW0_RCLONE_TARGET_IMAGE_REF:-a-review0-rclone-target:dev}
    build:
      context: ../../..
      dockerfile: some-implementations/stove0/review0/rclone-effect-target/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    command: ["a-review0-rclone-target", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      A_REVIEW0_RCLONE_TARGET_CONFIG: /etc/review0/rclone-target.yaml
      A_REVIEW0_RCLONE_TARGET_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      A_REVIEW0_RCLONE_TARGET_IMAGE_ID: ${A_REVIEW0_RCLONE_TARGET_IMAGE_ID:?A_REVIEW0_RCLONE_TARGET_IMAGE_ID is required}
      A_REVIEW0_RCLONE_TARGET_STATE_ROOT: /var/lib/a-review0-rclone-target
      A_REVIEW0_RCLONE_TARGET_WORKSPACE: /run/review0
      STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS: ${STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS:-2592000}
    depends_on:
      a-review0-opus-sampler:
        condition: service_healthy
    secrets:
      - a_review0_rclone_target_token
      - a_review0_opus_sampler_token
    networks: ["stove0-internal", "riverhog-control", "review-sampler"]
    volumes:
      - type: bind
        source: ${A_REVIEW0_RCLONE_TARGET_CONFIG_HOST_PATH:?A_REVIEW0_RCLONE_TARGET_CONFIG_HOST_PATH is required}
        target: /etc/review0/rclone-target.yaml
        read_only: true
      - a-review0-rclone-target-state:/var/lib/a-review0-rclone-target
      - review0-workspace:/run/review0
      - review0-effect-delivery:/var/lib/review0-delivery
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_TMPFS_SIZE:-1g}
    healthcheck: *ffmpeg-health

  a-stove0-nvenc-av1-opus-target:
    <<: *hardening
    image: ${A_STOVE0_NVENC_AV1_OPUS_TARGET_IMAGE_REF:-a-stove0-nvenc-av1-opus-target:dev}
    build: &nvenc-build
      context: ../../..
      dockerfile: some-implementations/stove0/targets/nvenc-av1-opus/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    profiles: ["nvenc"]
    gpus: all
    command: ["a-stove0-nvenc-av1-opus-target", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      A_STOVE0_NVENC_AV1_OPUS_TARGET_TOKEN_FILE: /run/secrets/a_stove0_nvenc_av1_opus_target_token
      A_STOVE0_NVENC_AV1_OPUS_TARGET_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      A_STOVE0_NVENC_AV1_OPUS_TARGET_IMAGE_ID: ${A_STOVE0_NVENC_AV1_OPUS_TARGET_IMAGE_ID:?A_STOVE0_NVENC_AV1_OPUS_TARGET_IMAGE_ID is required}
      A_STOVE0_NVENC_AV1_OPUS_TARGET_STATE_ROOT: /var/lib/a-stove0-nvenc-av1-opus-target
      A_STOVE0_NVENC_AV1_OPUS_TARGET_WORKSPACE: /run/a-stove0-nvenc-av1-opus-target
      STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS: ${STOVE0_TARGET_TERMINAL_STATE_RETENTION_SECONDS:-2592000}
    secrets: ["a_stove0_nvenc_av1_opus_target_token"]
    networks: ["stove0-internal", "riverhog-control"]
    volumes:
      - a-stove0-nvenc-av1-opus-target-state:/var/lib/a-stove0-nvenc-av1-opus-target
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_TMPFS_SIZE:-1g}
      - /run/a-stove0-nvenc-av1-opus-target:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_TARGET_TMPFS_SIZE:-32g}
    healthcheck: *ffmpeg-health

  a-review0-nvenc-av1-opus-sampler:
    <<: *hardening
    image: ${A_STOVE0_NVENC_AV1_OPUS_TARGET_IMAGE_REF:-a-stove0-nvenc-av1-opus-target:dev}
    build: *nvenc-build
    profiles: ["nvenc"]
    gpus: all
    command: ["a-review0-nvenc-av1-opus-sampler", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: ${TZ:-UTC}
      A_REVIEW0_NVENC_AV1_OPUS_SAMPLER_TOKEN_FILE: /run/secrets/a_review0_nvenc_av1_opus_sampler_token
      A_REVIEW0_NVENC_AV1_OPUS_SAMPLER_SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      A_REVIEW0_NVENC_AV1_OPUS_SAMPLER_IMAGE_ID: ${A_STOVE0_NVENC_AV1_OPUS_TARGET_IMAGE_ID:?A_STOVE0_NVENC_AV1_OPUS_TARGET_IMAGE_ID is required}
      A_REVIEW0_NVENC_AV1_OPUS_SAMPLER_WORKSPACE: /run/review0
    secrets: ["a_review0_nvenc_av1_opus_sampler_token"]
    networks: ["review-sampler"]
    volumes:
      - review0-workspace:/run/review0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=${STOVE0_TMPFS_SIZE:-1g}
    healthcheck: *ffmpeg-health

volumes:
  a-stove0-nvenc-av1-opus-target-state:
  a-stove0-opus-target-state:
  a-review0-materializer-state:
  a-review0-rclone-target-state:
  review0-effect-delivery:
  review0-workspace:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=${REVIEW0_TMPFS_SIZE:-32g},uid=65532,gid=65532,mode=0700

secrets:
  stove0_database_url:
    file: ${STOVE0_DATABASE_URL_FILE:?STOVE0_DATABASE_URL_FILE is required}
  stove0_target_callback_signing_key:
    file: ${STOVE0_TARGET_CALLBACK_SIGNING_KEY_FILE:?STOVE0_TARGET_CALLBACK_SIGNING_KEY_FILE is required}
  stove0_browse_token_signing_key:
    file: ${STOVE0_BROWSE_TOKEN_SIGNING_KEY_FILE:?STOVE0_BROWSE_TOKEN_SIGNING_KEY_FILE is required}
  stove0_api_token:
    file: ${STOVE0_API_TOKEN_FILE:?STOVE0_API_TOKEN_FILE is required}
  stove0_api_riverhog_token:
    file: ${STOVE0_API_RIVERHOG_TOKEN_FILE:?STOVE0_API_RIVERHOG_TOKEN_FILE is required}
  stove0_controller_riverhog_token:
    file: ${STOVE0_CONTROLLER_RIVERHOG_TOKEN_FILE:?STOVE0_CONTROLLER_RIVERHOG_TOKEN_FILE is required}
  stove0_worker_riverhog_token:
    file: ${STOVE0_WORKER_RIVERHOG_TOKEN_FILE:?STOVE0_WORKER_RIVERHOG_TOKEN_FILE is required}
  a_stove0_ffprobe_sampling_observer_token:
    file: ${A_STOVE0_FFPROBE_SAMPLING_OBSERVER_TOKEN_FILE:?A_STOVE0_FFPROBE_SAMPLING_OBSERVER_TOKEN_FILE is required}
  a_stove0_exiftool_observer_token:
    file: ${A_STOVE0_EXIFTOOL_OBSERVER_TOKEN_FILE:?A_STOVE0_EXIFTOOL_OBSERVER_TOKEN_FILE is required}
  a_stove0_nvenc_av1_opus_target_token:
    file: ${A_STOVE0_NVENC_AV1_OPUS_TARGET_TOKEN_FILE:?A_STOVE0_NVENC_AV1_OPUS_TARGET_TOKEN_FILE is required}
  a_review0_nvenc_av1_opus_sampler_token:
    file: ${A_REVIEW0_NVENC_AV1_OPUS_SAMPLER_TOKEN_FILE:?A_REVIEW0_NVENC_AV1_OPUS_SAMPLER_TOKEN_FILE is required}
  a_stove0_opus_target_token:
    file: ${A_STOVE0_OPUS_TARGET_TOKEN_FILE:?A_STOVE0_OPUS_TARGET_TOKEN_FILE is required}
  a_review0_opus_sampler_token:
    file: ${A_REVIEW0_OPUS_SAMPLER_TOKEN_FILE:?A_REVIEW0_OPUS_SAMPLER_TOKEN_FILE is required}
  a_review0_materializer_token:
    file: ${A_REVIEW0_MATERIALIZER_TOKEN_FILE:?A_REVIEW0_MATERIALIZER_TOKEN_FILE is required}
  a_review0_rclone_target_token:
    file: ${A_REVIEW0_RCLONE_TARGET_TOKEN_FILE:?A_REVIEW0_RCLONE_TARGET_TOKEN_FILE is required}

networks:
  stove0-internal:
    internal: true
  review-sampler:
    internal: true
  riverhog-control:
    external: true
    name: ${RIVERHOG_CONTROL_NETWORK:-riverhog_default}
