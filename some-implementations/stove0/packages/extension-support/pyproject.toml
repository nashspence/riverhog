[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "stove0-extension-support"
version = "0.1.0"
description = "Component-local execution admission and state ownership for Stove0 extensions."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Component-local execution admission and state ownership for Stove0 extensions.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = ["release-documentation-lib>=0.1,<0.2", "pydantic>=2.7,<3.0", "riverhog-client>=0.1,<0.2", "riverhog-protocol>=0.1,<0.2"]

[tool.uv.sources]
release-documentation-lib = { workspace = true }
riverhog-client = { workspace = true }
riverhog-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/stove0_extension_support"]
