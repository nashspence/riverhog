[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "a-review0-rclone-target"
version = "0.1.0"
description = "Review0 rclone delivery target for Stove0."
requires-python = ">=3.12"
license = "CAL-1.0"
license-files = ["LICENSE"]
readme = { text = "Review0 rclone delivery target for Stove0.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = ["Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Typing :: Typed"]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "fastapi>=0.111,<1.0",
  "pydantic>=2.7,<3.0",
  "riverhog-protocol>=0.1,<0.2",
  "riverhog-client>=0.1,<0.2",
  "review0-target-contracts>=0.1,<0.2",
  "review0-target-lib>=0.1,<0.2",
  "stove0-target-support>=0.1,<0.2",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
a-review0-rclone-target = "a_review0_rclone_target.app:main"

[tool.uv.sources]
riverhog-protocol = { workspace = true }
riverhog-client = { workspace = true }
review0-target-contracts = { workspace = true }
review0-target-lib = { workspace = true }
stove0-target-support = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/a_review0_rclone_target"]
