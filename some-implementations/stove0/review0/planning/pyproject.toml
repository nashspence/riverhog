[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "review0-planner"
version = "0.1.0"
description = "Review0 plan construction for Stove0 workflows."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Review0 plan construction for Stove0 workflows.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "pydantic>=2.7,<3.0",
  "stove0-media-sampling-observer-contracts>=0.1,<0.2",
  "stove0-protocol>=0.1,<0.2",
  "review0-target-contracts>=0.1,<0.2",
]

[project.scripts]
review0-planner = "review0_planner.conformance:main"

[tool.uv.sources]
stove0-media-sampling-observer-contracts = { workspace = true }
stove0-protocol = { workspace = true }
review0-target-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/review0_planner"]
