[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "a-stove0-filename-prefix-sidecar-observer"
version = "0.1.0"
description = "Exact source-name candidate observations for Stove0."
requires-python = ">=3.12"
license = "CAL-1.0"
license-files = ["LICENSE"]
readme = { text = "Exact source-name candidate observations for Stove0.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = ["Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Typing :: Typed"]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "riverhog-canonical-json>=0.1,<0.2",
  "riverhog-provenance-contracts>=0.1,<0.2",
]

[tool.uv.sources]
riverhog-canonical-json = { workspace = true }
riverhog-provenance-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/a_stove0_filename_prefix_sidecar_observer"]
