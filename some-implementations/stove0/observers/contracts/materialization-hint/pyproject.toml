[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "a-stove0-materialization-hint-evidence-contract-lib"
version = "0.1.0"
description = "Accepted Stove0 evidence for a selected Riverhog Occurrence materialization hint."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { text = "Accepted Stove0 evidence for a selected Riverhog Occurrence materialization hint.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = ["Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Typing :: Typed"]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "pydantic>=2.7,<3.0",
  "riverhog-provenance-contracts>=0.1,<0.2",
  "stove0-observer-protocol>=0.1,<0.2",
]

[project.entry-points."stove0.observer-semantic-validators"]
materialization-hint = "a_stove0_materialization_hint_evidence_contract_lib:MATERIALIZATION_HINT_SEMANTIC_VALIDATOR"

[tool.uv.sources]
riverhog-provenance-contracts = { workspace = true }
stove0-observer-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/a_stove0_materialization_hint_evidence_contract_lib"]
