[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "a-stove0-magic-observer"
version = "0.1.0"
description = "Bounded byte-only file classification observer for Stove0."
requires-python = ">=3.12"
license = "CAL-1.0"
license-files = ["LICENSE"]
readme = { text = "Bounded byte-only file classification observer for Stove0.\n\nSee the project URL for documentation and releases.", content-type = "text/markdown" }
authors = [{ name = "Nash Spence" }]
maintainers = [{ name = "Nash Spence" }]
classifiers = ["Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Typing :: Typed"]
urls = { Documentation = "https://nashspence.github.io/riverhog/v1/", Issues = "https://github.com/nashspence/riverhog/issues", Repository = "https://github.com/nashspence/riverhog" }
dependencies = [
  "a-stove0-magic-facts-contract-lib>=0.1,<0.2",
  "fastapi>=0.111,<1.0",
  "http-api-contracts>=0.1,<0.2",
  "pydantic>=2.7,<3.0",
  "stove0-observer-protocol>=0.1,<0.2",
  "stove0-observer-support>=0.1,<0.2",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
a-stove0-magic-observer = "a_stove0_magic_observer.app:main"

[tool.uv.sources]
a-stove0-magic-facts-contract-lib = { workspace = true }
http-api-contracts = { workspace = true }
stove0-observer-protocol = { workspace = true }
stove0-observer-support = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/a_stove0_magic_observer"]
