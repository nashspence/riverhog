# SPDX-License-Identifier: Apache-2.0
[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["."]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ots_core", "sqlite_example", "test_ots_core"]
