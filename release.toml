[contract_authorities]
repository = "Repository-owned v1 boundary and packaging promises."
release = "Coordinated v1 compatibility and publication promises."
riverhog = "The Riverhog service API and its maintained cross-interface operation parity."
stove0 = "The Stove0 application API and its maintained cross-interface operation parity."
extent-contract = "Repository-wide v1 external extent principles and rules."

[compatibility]
components = "A supported deployment runs components from one coordinated product version."
http_api = "Published v1 HTTP and native lifecycle-event contracts remain backward compatible throughout v1."
cli = "Command names, options, exit status, and structured output remain backward compatible throughout v1; prose output is for people."
python_api = "Freeze-protected declared public-module exports, callable signatures, selected constants, enum members and values, and selected public model and dataclass structures remain backward compatible throughout v1."
durable_state = "Every later v1 release applies each durable-state authority's declared transition rule to state created by every earlier v1 release; this does not promise downgrade support or earlier software reading later state."
archive = "A valid v1 archive remains independently recoverable throughout the supported v1 lifetime. Pack construction, ingress checkpointing, and resumable-write strategies are not archive-format compatibility promises."
recovery = "Every later v1 recovery release reads every valid earlier v1 archive and provenance set."
configuration = "Accepted v1 configuration remains valid throughout v1 unless an unsafe value must be rejected."
licensing = "Each continuing first-party Python distribution and OCI repository published in v1 retains every SPDX license alternative granted when that coordinate first shipped in v1; withdrawing a baseline grant requires a new major version."

