  "build a-stove0-nvenc-av1-opus-target",
  "build a-stove0-opus-target",
  "build riverhog",
  "build stove0",
  "build test",
  "client platform (macos-15)",
  "client platform (ubuntu-24.04)",
  "client platform (windows-2025)",
  "make c2sp-vectors",
  "make compile",
  "make compose-smoke",
  "make dist-smoke",
  "make filesystem-recovery-qualification",
  "make implementation-policy",
  "make lint",
  "make postgres-concurrency",
  "make unit",
]

[governance.main]
delivery = "Direct maintainer commits during pre-v1 contract convergence, followed by exact-SHA GitHub check validation."
protection = "An active no-bypass ruleset requires linear history and rejects force-push and deletion; it has no pull-request or pre-push status gate."

[governance.release]
delivery = "Keep the protected branch pinned until the maintainer declares a new freeze candidate, then fast-forward it to an exact green main commit through its pull-request rail."
required_approvals = 0
review_policy = "The sole maintainer must inspect the diff and check result; add approval requirements when another maintainer can provide meaningful review."
contents = "The last synchronized pre-v1 checkpoint; main is the active contract-convergence authority until a new freeze candidate is declared."
synchronization = "The pinned release/v1 commit must remain an ancestor of main; synchronize only an explicitly selected, fully green main commit."

[governance.tags]
release_candidate = "v{version}-rc.{candidate}"
final = "v{version}"
immutability = "Published v1 tags are never moved or deleted."
github_releases = "GitHub immutable releases must remain enabled before any v1 publication."
failed_publication = "Resume only for the same tag and source SHA when safe; otherwise publish the next release candidate or patch version."

[governance.authority]
branches = "The Riverhog release maintainer creates release branches after their tracker gate is clean."
tags = "The Riverhog release maintainer alone creates release-candidate and final tags."
github_releases = "The Riverhog release maintainer approves the protected release-publication environment."
registries = "The Riverhog release maintainer approves the protected release-publication environment."
pages = "The Riverhog release maintainer approves the protected github-pages environment."
provider_qualification = "The Riverhog release maintainer approves AWS infrastructure reconciliation; B2 provisioning is manual and read-only conformance checks plus restartable runtime polling are unattended."

[governance.environments]
release = "release-publication"
pages = "github-pages"
provider_qualification_provisioning = "provider-qualification-provisioning"
provider_qualification_runtime = "provider-qualification"

