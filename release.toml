[governance]
repository = "nashspence/riverhog"
maintainer = "nashspence"
workflow_source_branch = "main"
branch_delivery = "pre-v1-main-convergence"
required_check_integration_id = 15368
required_checks = [
  "Analyze (actions)",
  "Analyze (python)",
  "build a-review0-materializer",
  "build a-review0-rclone-target",
  "build a-riverhog-aws-store",
  "build a-riverhog-b2-store",
  "build a-riverhog-event-relay",
