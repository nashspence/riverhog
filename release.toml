[publication]
role_retention = "Publication creates no new product, API, protocol, provider, or direct-consumption promise. Each publication unit retains its exact release role and links to its existing semantic owners."
platform_scope = "A platform or architecture claim applies only to the exact published image, distribution, or installation form that carries it. Qualification platforms remain evidence unless an external contract independently protects them."
image_identity_scope = "Runtime descriptors use OCI ImageID (the image configuration SHA-256 digest). A platform-specific image-manifest digest pins a deployed image; an image-index digest identifies the publication set, including attestations. Nonpublishing qualification records local ImageIDs; publication evidence records platform manifest digests. Per-release identities are not permanent v1 contract constants."

[signing]
checksums = "SHA-256"
signature = "minisign"
key_owner = "The Riverhog release maintainer owns the offline release-signing key."
secret_key = "The secret key remains outside the repository, GitHub, CI logs, and release artifacts."
public_key = "The public key is distributed in the v1 documentation and every GitHub release."
rotation = "Generate a new offline key and publish a transition signed by both old and new keys."
compromise = "Stop publication, disclose and revoke affected evidence, and issue a new patch release without moving an existing tag."
github_oidc = "Published GitHub artifacts also receive workflow identity attestations; they complement rather than replace the maintainer signature."

