distribution = "riverhog-ftp-adapter"
format = "riverhog-ftp-adapter-claim/v1"
head = "v1"
transition = "backward-readable-documents"
structure = { kind = "python-contract", module = "riverhog_ftp_adapter.state_contract", symbol = "ftp_custody_state_contract" }
fixtures = [
  "tests/fixtures/state/v1_0001/riverhog-ftp-adapter/claim.json",
  "tests/fixtures/state/v1_0001/riverhog-ftp-adapter/payload.bin",
]

[[state.owners]]
id = "riverhog-provenance-installation"
distribution = "riverhog-provenance"
format = "riverhog-provenance-installation-id/v1"
head = "v1"
transition = "immutable-identity"
structure = { kind = "python-contract", module = "riverhog_provenance.identity", symbol = "_installation_id_state_contract" }
fixtures = ["tests/fixtures/state/v1_0001/provenance-installation-id"]

[artifacts]
python_formats = ["wheel", "sdist"]
documentation = "riverhog-docs-v{version}.tar.gz"
source = "riverhog-source-v{version}.tar.gz"
contract = "riverhog-v1-contract.tar.gz"
evidence = [
  "riverhog-v1-contract.tar.gz",
  "install-manifest.json",
  "release-manifest.json",
  "SHA256SUMS",
  "SHA256SUMS.minisig",
  "release.spdx.json",
  "release.intoto.jsonl",
  "THIRD_PARTY_NOTICES.md",
]

[artifacts.notices]
schema = "riverhog-artifact-notices/v1"
directory = "notices"
format = "tar.gz"
basis = "exact-artifact-contents"
required_for = ["wheel", "image"]

[installation]
method = "uv-tool"
lock_format = "pylock.toml"
managed_python = true
wheel_only = true
simple_index_path = "artifacts/v{version}/simple/"
roots = ["gogurt", "piggity", "riverhog-recover", "stove0-client"]

[installation.listener]
root = "gogurt"
scope = "current-user"
resume = "next-login"
autorun = "explicit-required"
provider_selection = "explicit"
provider_identity = "persisted-exactly"

[qualification.gogurt_reference]
purpose = "Maintainer-selected Gogurt reference conformance."
linux-x64 = { mounted_volume_distribution = "gogurt-linux-mounted-volume", mounted_volume_provider = "gogurt-linux-mounted-volume", listener_host_distribution = "gogurt-linux-listener-host", listener_host_provider = "gogurt-linux-listener-host" }
macos-arm64 = { mounted_volume_distribution = "gogurt-macos-mounted-volume", mounted_volume_provider = "gogurt-macos-mounted-volume", listener_host_distribution = "gogurt-macos-listener-host", listener_host_provider = "gogurt-macos-listener-host" }
windows-x64 = { mounted_volume_distribution = "gogurt-windows-mounted-volume", mounted_volume_provider = "gogurt-windows-mounted-volume", listener_host_distribution = "gogurt-windows-listener-host", listener_host_provider = "gogurt-windows-listener-host" }

[qualification.storage_reference]
purpose = "Maintainer-selected storage-adapter reference conformance."
distributions = ["riverhog-storage-adapter-aws", "riverhog-storage-adapter-backblaze", "riverhog-storage-adapter-filesystem"]
cases = ["filesystem-retrieval-cache", "b2-archive", "b2-retrieval-cache", "aws-deep-archive", "aws-cloudfront-egress"]

[references]
policy = "Checked-in references form a closed, tightly scoped, maintainer-selected, nonnormative conformance set."

[publication]
role_retention = "Publication creates no new product, API, protocol, provider, or direct-consumption promise. Each publication unit retains its exact release role and links to its existing semantic owners."
platform_scope = "A platform or architecture claim applies only to the exact published image, distribution, or installation form that carries it. Qualification platforms remain evidence unless an external contract independently protects them."
image_digest_scope = "Per-release image digests are publication evidence rather than permanent v1 contract constants."

[signing]
checksums = "SHA-256"
signature = "minisign"
key_owner = "The Riverhog release maintainer owns the offline release-signing key."
secret_key = "The secret key remains outside the repository, GitHub, CI logs, and release artifacts."
public_key = "The public key is distributed in the v1 documentation and every GitHub release."
rotation = "Generate a new offline key and publish a transition signed by both old and new keys."
compromise = "Stop publication, disclose and revoke affected evidence, and issue a new patch release without moving an existing tag."
github_oidc = "Published GitHub artifacts also receive workflow identity attestations; they complement rather than replace the maintainer signature."

