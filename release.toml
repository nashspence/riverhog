head = "v1_0001"
transition = "forward-migration-chain"
structure = { kind = "sql-ddl", dialect = "sqlite", module = "piggity.state_migrations.v1_ddl", symbol = "SQLITE_DDL" }
fixtures = ["tests/fixtures/state/v1_0001/piggity.sqlite.sql"]

[[state.owners]]
id = "mango-fish-cursor"
distribution = "mango-fish"
format = "state-schema/sqlite"
head = "v1_0001"
transition = "forward-migration-chain"
structure = { kind = "sql-ddl", dialect = "sqlite", module = "mango_fish.state_migrations.v1_ddl", symbol = "SQLITE_DDL" }
fixtures = ["tests/fixtures/state/v1_0001/mango-fish.sqlite.sql"]

[[state.owners]]
id = "stove0-control"
distribution = "stove0-server"
format = "state-schema/postgresql"
head = "v1_0001"
transition = "forward-migration-chain"
structure = { kind = "sql-ddl", dialect = "postgresql", module = "stove0_core.state_migrations.v1_ddl", symbol = "POSTGRESQL_DDL" }
fixtures = ["tests/fixtures/state/v1_0001/stove0.postgresql.sql"]

[[state.owners]]
id = "gogurt-listener"
distribution = "gogurt-listener-runtime"
format = "gogurt-listener-state/v1"
head = "1"
transition = "forward-migration-chain"
structure = { kind = "sql-ddl", dialect = "sqlite", module = "gogurt_listener_runtime.listener", symbol = "_LISTENER_STATE_DDL" }
