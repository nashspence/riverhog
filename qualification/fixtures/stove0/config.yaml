database_url_file: /run/secrets/stove0_database_url
api_token_file: /run/secrets/stove0_api_token
riverhog_base_url: http://app:8000
riverhog_token_file: /run/secrets/stove0_riverhog_token
riverhog_allow_insecure_http: true
browse_token_signing_key_file: /run/secrets/stove0_browse_token_signing_key
declared_workspace_protection: memory-backed
scheduler_interval_seconds: 0.25
observers:
  exiftool:
    base_url: http://a-stove0-exiftool-observer:8080
    token_file: /run/secrets/a_stove0_exiftool_observer_token
    allow_insecure_http: true
    semantic_validator_providers: [media-metadata]
  ffprobe-sampling:
    base_url: http://a-stove0-ffprobe-observer:8080
    token_file: /run/secrets/a_stove0_ffprobe_observer_token
    allow_insecure_http: true
    semantic_validator_providers: [media-sampling]
  canonical-hint:
    base_url: http://a-stove0-riverhog-provenance-observer:8080
    token_file: /run/secrets/a_stove0_riverhog_provenance_observer_token
    allow_insecure_http: true
    semantic_validator_providers: [materialization-hint]
targets:
  nvenc-av1-opus:
    base_url: http://a-stove0-nvenc-av1-opus-target:8080
    token_file: /run/secrets/a_stove0_nvenc_av1_opus_target_token
    allow_insecure_http: true
  opus:
    base_url: http://a-stove0-opus-target:8080
    token_file: /run/secrets/a_stove0_opus_target_token
    allow_insecure_http: true
  review:
    base_url: http://review0:8080
    token_file: /run/secrets/review0_token
    allow_insecure_http: true
  rclone:
    base_url: http://a-stove0-rclone-target:8080
    token_file: /run/secrets/a_stove0_rclone_target_token
    allow_insecure_http: true
target_callback_base_url: http://api:8080
target_callback_allow_insecure_http: true
target_callback_signing_key_file: /run/secrets/stove0_target_callback_signing_key
recipes:
  format: stove0-recipes/v1
  operations: []
  recipes: []
