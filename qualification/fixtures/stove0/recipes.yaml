        profile_sha256: 756bf8a7aa1ad8651fffbcc0a2cb7b7a02e1f5ab254b2656c025d04a8b6d47eb
        dialect: https://json-schema.org/draft/2020-12/schema
        format_policy: annotation-only
        schema:
          $defs:
            CollectionArtifactProvenanceBindingDocument:
              additionalProperties: false
              description: A member's exact primary journal and delivery association.
              properties:
                artifact_id:
                  pattern: ^[0-9a-f]{64}$
                  title: Artifact Id
                  type: string
                journal:
                  $ref: '#/$defs/JournalAnchorDocument'
                delivery_association_id:
                  $ref: '#/$defs/ProvenanceId'
              required:
              - artifact_id
              - journal
              - delivery_association_id
              title: CollectionArtifactProvenanceBindingDocument
              type: object
            EntryReference:
              additionalProperties: false
              properties:
                entry_id:
                  $ref: '#/$defs/ProvenanceEntryId'
                sequence:
                  pattern: ^(?:0|[1-9][0-9]*)(?![\s\S])
                  title: Sequence
                  type: string
                json_sha256:
                  $ref: '#/$defs/Sha256'
              required:
              - entry_id
              - sequence
              - json_sha256
              title: EntryReference
              type: object
            ExternalReference:
              additionalProperties: false
              properties:
                scope:
                  const: external
                  default: external
                  title: Scope
                  type: string
                journal_id:
                  $ref: '#/$defs/ProvenanceJournalId'
                entry:
                  $ref: '#/$defs/EntryReference'
                assertion_id:
                  $ref: '#/$defs/ProvenanceAssertionId'
                object_id:
                  $ref: '#/$defs/ProvenanceId'
                object_type:
                  $ref: '#/$defs/ObjectType'
              required:
              - journal_id
              - entry
              - assertion_id
              - object_id
              - object_type
              title: ExternalReference
              type: object
            JournalAnchorDocument:
              additionalProperties: false
              description: One exact validated journal prefix, never an implied latest tail.
              properties:
                journal_id:
                  $ref: '#/$defs/ProvenanceJournalId'
                through:
                  $ref: '#/$defs/EntryReference'
                prefix_sha256:
                  pattern: ^[0-9a-f]{64}$
                  title: Prefix Sha256
                  type: string
                prefix_bytes:
                  $ref: '#/$defs/NonnegativeDecimal'
                  ge: 1
              required:
              - journal_id
              - through
              - prefix_sha256
              - prefix_bytes
              title: JournalAnchorDocument
              type: object
            JsonValue: {}
            MaterializationHintFact:
              additionalProperties: false
              description: One selected subject and its exact canonical Occurrence assertion.
              properties:
                subject_id:
                  minLength: 1
                  title: Subject Id
                  type: string
                primary_binding:
                  $ref: '#/$defs/CollectionArtifactProvenanceBindingDocument'
                occurrence:
                  $ref: '#/$defs/ExternalReference'
                materialization_hint:
                  anyOf:
                  - additionalProperties:
                      $ref: '#/$defs/JsonValue'
                    type: object
                  - type: 'null'
                  title: Materialization Hint
              required:
              - subject_id
              - primary_binding
              - occurrence
              - materialization_hint
              title: MaterializationHintFact
              type: object
            NonnegativeDecimal:
              pattern: ^(?:0|[1-9][0-9]*)(?![\s\S])
              type: string
            ObjectType:
              enum:
              - artifact
              - occurrence
              - state
              - agent
              - context
              - activity
              - observation
              - reported_description
              - usage
              - generation
              - invalidation
              - derivation
              - specialization
              - continuity
              - content_comparison
              - locator_binding
              - locator_binding_end
              - delivery_association
              - custody_assertion
              - availability_assertion
              - journal_subject
              - extension
              type: string
            ProvenanceAssertionId:
              pattern: ^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?![\s\S])
              type: string
            ProvenanceEntryId:
              pattern: ^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?![\s\S])
              type: string
            ProvenanceId:
              pattern: ^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?![\s\S])
              type: string
            ProvenanceJournalId:
              pattern: ^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?![\s\S])
              type: string
            Sha256:
              pattern: ^[0-9a-f]{64}(?![\s\S])
              type: string
          additionalProperties: false
          properties:
            artifacts:
              items:
                $ref: '#/$defs/MaterializationHintFact'
              minItems: 1
              title: Artifacts
              type: array
          required:
          - artifacts
          title: MaterializationHintFacts
          type: object
          $schema: https://json-schema.org/draft/2020-12/schema
