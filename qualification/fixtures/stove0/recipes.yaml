  observers:
  - registration_id: exiftool
    contract_id: stove0.media.metadata/v1
    contract_sha256: 4f9316118eb68d64154e3013e7e7d89738097881fb399ad3a3721404a47e375c
    artifact_rules:
    - glob: '*.XMP'
      role: stove0.media.xmp-source/v1
