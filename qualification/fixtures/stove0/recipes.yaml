    - glob: '*.mov'
      role: stove0.media.source/v1
      media_type: video/quicktime
    - glob: '*.wav'
      role: stove0.media.source/v1
      media_type: audio/wav
    - glob: '*.xmp'
      role: stove0.media.xmp-source/v1
      media_type: application/rdf+xml
    retrieval_policy: available-only
  routes:
