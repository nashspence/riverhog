  audio:
    format: stove0-recipe/v1
    id: stove0.audio-archive/v1
    revision: 1
    roles:
      primary: stove0.media.source/v1
      sidecar: stove0.media.xmp-source/v1
    observe:
      metadata:
        use: metadata
        executor: exiftool
        retrieve: allow
      streams:
        use: streams
        executor: ffprobe-streams
        inputs:
          subjects:
            roles:
            - primary
        retrieve: allow
      provenance:
        use: provenance
        executor: canonical-provenance
        inputs:
          subjects:
            roles:
            - primary
            - sidecar
        options:
          predicates:
          - https://nashspence.github.io/riverhog/v1/provenance/relations/describes
      hint:
        use: hint
        executor: canonical-hint
        inputs:
          subjects:
            roles:
            - primary
            - sidecar
      filename:
        use: filename
        executor: filename-prefix-sidecars
        inputs:
          primary:
            roles:
            - primary
          sidecar:
            roles:
            - sidecar
          provenance:
            evidence: provenance
        options:
          sidecar_suffixes:
          - .XMP
          - .xmp
    classify:
      cases:
      - role: sidecar
        when:
          facts:
            view: metadata.artifacts
            scope: self
            quantifier: any
            where:
              items:
                path: /facts
                quantifier: any
                where:
                  all:
                  - test:
                      path: /name
                      op: eq
                      value: container-format
                  - test:
                      path: /value
                      op: in
                      value:
                      - XMP
                      - application/rdf+xml
      otherwise: primary
    groups:
      media:
        primary: primary
        attach:
        - sidecar
        prefer:
        - provenance.describes
        - filename.full_leaf
        - filename.stem
    fork:
      archive-audio:
        select:
          groups: media
        when:
          all:
          - facts:
              view: streams.artifacts
              scope: candidate
              roles:
              - primary
              quantifier: every
