    kind: operation
    operation_id: stove0.media.audio-archive/v1
    target_registration_id: opus
    artifact_rules:
    - glob: '*.XMP'
      role: stove0.media.xmp-source/v1
      media_type: application/rdf+xml
    - glob: '*.xmp'
      role: stove0.media.xmp-source/v1
      media_type: application/rdf+xml
    - glob: '*'
