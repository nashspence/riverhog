  provenance:
    kind: observer
    contract:
      id: stove0.riverhog-provenance/v1
      read_actions:
      - read-provenance
      options_schema:
        id: stove0.riverhog-provenance-options/v1
        profile_sha256: d882372d67e18279774bca56594936ba8c3b18e8b742386dde73157b1fd52140
        dialect: https://json-schema.org/draft/2020-12/schema
        format_policy: annotation-only
        schema:
          additionalProperties: false
          properties:
            predicates:
              default: []
              items:
                type: string
              maxItems: 64
              title: Predicates
              type: array
          title: CoreProvenanceOptions
          type: object
          $schema: https://json-schema.org/draft/2020-12/schema
      facts_schema:
        id: stove0.riverhog-provenance-facts/v1
        profile_sha256: feee75f43d956f914068638b1b1abce970029b4b3e1729193223a8bbcf84a378
        dialect: https://json-schema.org/draft/2020-12/schema
        format_policy: annotation-only
        schema:
          $defs:
            ArchiveRecordSetReferenceDocument:
              additionalProperties: false
              properties:
                format:
                  const: riverhog-archive-record-set/v1
                  default: riverhog-archive-record-set/v1
                  title: Format
                  type: string
                schema_id:
                  minLength: 1
                  title: Schema Id
                  type: string
                record_count:
                  $ref: '#/$defs/NonnegativeDecimal'
                records_sha256:
                  pattern: ^[0-9a-f]{64}$
                  title: Records Sha256
                  type: string
              required:
              - schema_id
              - record_count
              - records_sha256
              title: ArchiveRecordSetReferenceDocument
              type: object
            AssertionSupport:
              additionalProperties: false
              properties:
                journal:
                  $ref: '#/$defs/JournalAnchorDocument'
                entry:
                  $ref: '#/$defs/EntryReference'
                assertion_id:
                  title: Assertion Id
                  type: string
                referent_id:
                  title: Referent Id
                  type: string
                pointer:
                  title: Pointer
                  type: string
              required:
              - journal
              - entry
              - assertion_id
              - referent_id
              - pointer
              title: AssertionSupport
              type: object
            CanonicalEndpoint:
              additionalProperties: false
              properties:
                journal_id:
                  title: Journal Id
                  type: string
                entry:
                  $ref: '#/$defs/EntryReference'
                assertion_id:
                  title: Assertion Id
                  type: string
                object_id:
                  title: Object Id
                  type: string
                object_type:
                  title: Object Type
                  type: string
              required:
              - journal_id
              - entry
              - assertion_id
              - object_id
              - object_type
              title: CanonicalEndpoint
              type: object
            CollectionArtifactProvenanceBindingDocument:
              additionalProperties: false
              description: A member's exact primary journal and delivery association.
              properties:
                artifact_id:
                  pattern: ^[0-9a-f]{64}$
                  title: Artifact Id
                  type: string
                journal:
                  $ref: '#/$defs/JournalAnchorDocument'
                delivery_association_id:
                  $ref: '#/$defs/ProvenanceId'
              required:
              - artifact_id
              - journal
              - delivery_association_id
              title: CollectionArtifactProvenanceBindingDocument
              type: object
            CoreClaimFact:
              additionalProperties: false
              properties:
                predicate:
                  maxLength: 2048
                  minLength: 1
                  title: Predicate
                  type: string
                subject:
                  $ref: '#/$defs/CanonicalEndpoint'
                value_type:
                  minLength: 1
                  title: Value Type
                  type: string
                object:
                  anyOf:
                  - $ref: '#/$defs/CanonicalEndpoint'
                  - type: 'null'
                value:
                  anyOf:
                  - additionalProperties:
                      $ref: '#/$defs/JsonValue'
                    type: object
                  - type: 'null'
                  title: Value
                evidence:
                  items:
                    additionalProperties:
                      $ref: '#/$defs/JsonValue'
                    type: object
                  title: Evidence
                  type: array
                support:
                  $ref: '#/$defs/AssertionSupport'
              required:
              - predicate
              - subject
              - value_type
              - object
              - value
              - evidence
              - support
              title: CoreClaimFact
              type: object
            CoreLocatorFact:
              additionalProperties: false
              properties:
                subject_id:
                  title: Subject Id
                  type: string
                locator:
                  additionalProperties:
                    $ref: '#/$defs/JsonValue'
                  title: Locator
                  type: object
                context_endpoint:
                  $ref: '#/$defs/CanonicalEndpoint'
                context_identifiers:
                  items:
                    additionalProperties:
                      $ref: '#/$defs/JsonValue'
                    type: object
                  title: Context Identifiers
                  type: array
                context_support:
                  $ref: '#/$defs/AssertionSupport'
                locator_support:
                  $ref: '#/$defs/AssertionSupport'
                temporal_scope:
                  additionalProperties:
                    $ref: '#/$defs/JsonValue'
                  title: Temporal Scope
                  type: object
                observation_endpoint:
                  $ref: '#/$defs/CanonicalEndpoint'
              required:
              - subject_id
              - locator
              - context_endpoint
              - context_identifiers
              - context_support
              - locator_support
              - temporal_scope
              - observation_endpoint
              title: CoreLocatorFact
              type: object
            CoreProvenanceFact:
              additionalProperties: false
              properties:
                subject_id:
                  minLength: 1
                  title: Subject Id
                  type: string
                primary_binding:
                  $ref: '#/$defs/CollectionArtifactProvenanceBindingDocument'
                history_binding:
                  $ref: '#/$defs/MemberHistoryBindingDocument'
                member_history:
                  $ref: '#/$defs/MemberHistoryDescriptorDocument'
                history_extent:
                  const: bound-and-required-history
                  title: History Extent
                  type: string
                state:
                  $ref: '#/$defs/CanonicalEndpoint'
                occurrence:
                  $ref: '#/$defs/CanonicalEndpoint'
                artifact:
                  $ref: '#/$defs/CanonicalEndpoint'
                producing_activity:
                  anyOf:
                  - $ref: '#/$defs/CanonicalEndpoint'
                  - type: 'null'
                generation_support:
                  anyOf:
                  - $ref: '#/$defs/AssertionSupport'
                  - type: 'null'
                locators:
                  items:
                    $ref: '#/$defs/CoreLocatorFact'
                  title: Locators
                  type: array
                claims:
                  items:
                    $ref: '#/$defs/CoreClaimFact'
                  title: Claims
                  type: array
                materialization_hint:
                  anyOf:
                  - additionalProperties:
                      $ref: '#/$defs/JsonValue'
                    type: object
                  - type: 'null'
                  title: Materialization Hint
              required:
              - subject_id
              - primary_binding
              - history_binding
              - member_history
              - history_extent
              - state
              - occurrence
              - artifact
              - producing_activity
              - generation_support
              - locators
              - claims
              - materialization_hint
              title: CoreProvenanceFact
              type: object
            EntryReference:
              additionalProperties: false
              properties:
                entry_id:
                  $ref: '#/$defs/ProvenanceEntryId'
                sequence:
                  pattern: ^(?:0|[1-9][0-9]*)(?![\s\S])
                  title: Sequence
                  type: string
                json_sha256:
                  $ref: '#/$defs/Sha256'
              required:
              - entry_id
              - sequence
              - json_sha256
              title: EntryReference
              type: object
            JournalAnchorDocument:
              additionalProperties: false
              description: One exact validated journal prefix, never an implied latest tail.
              properties:
                journal_id:
                  $ref: '#/$defs/ProvenanceJournalId'
                through:
                  $ref: '#/$defs/EntryReference'
                prefix_sha256:
                  pattern: ^[0-9a-f]{64}$
                  title: Prefix Sha256
                  type: string
                prefix_bytes:
                  $ref: '#/$defs/NonnegativeDecimal'
                  ge: 1
              required:
              - journal_id
              - through
              - prefix_sha256
              - prefix_bytes
              title: JournalAnchorDocument
              type: object
            JsonValue: {}
            MemberHistoryBindingDocument:
              additionalProperties: false
              description: Final root-authenticated lookup of one exact history descriptor.
              properties:
                artifact_id:
                  pattern: ^[0-9a-f]{64}$
                  title: Artifact Id
                  type: string
                bytes:
                  $ref: '#/$defs/NonnegativeDecimal'
                sha256:
                  pattern: ^[0-9a-f]{64}$
                  title: Sha256
                  type: string
                history_sha256:
                  pattern: ^[0-9a-f]{64}$
                  title: History Sha256
                  type: string
                history_bytes:
                  $ref: '#/$defs/NonnegativeDecimal'
                  ge: 1
                  le: 65536
              required:
              - artifact_id
              - bytes
              - sha256
              - history_sha256
              - history_bytes
              title: MemberHistoryBindingDocument
              type: object
            MemberHistoryDescriptorDocument:
              additionalProperties: false
              description: Bounded header selecting exact paged roots and inherited histories.
              properties:
                format:
                  const: riverhog-member-history/v1
                  default: riverhog-member-history/v1
                  title: Format
                  type: string
                artifact_id:
                  pattern: ^[0-9a-f]{64}$
                  title: Artifact Id
                  type: string
                bytes:
                  $ref: '#/$defs/NonnegativeDecimal'
                sha256:
                  pattern: ^[0-9a-f]{64}$
                  title: Sha256
                  type: string
                primary:
                  $ref: '#/$defs/MemberHistoryPrimaryDocument'
                roots:
                  $ref: '#/$defs/ArchiveRecordSetReferenceDocument'
                imports:
                  $ref: '#/$defs/ArchiveRecordSetReferenceDocument'
              required:
              - artifact_id
              - bytes
              - sha256
              - primary
              - roots
              - imports
              title: MemberHistoryDescriptorDocument
              type: object
            MemberHistoryPrimaryDocument:
              additionalProperties: false
              properties:
                journal:
                  $ref: '#/$defs/JournalAnchorDocument'
                delivery_association_id:
                  $ref: '#/$defs/ProvenanceId'
              required:
              - journal
              - delivery_association_id
              title: MemberHistoryPrimaryDocument
              type: object
            NonnegativeDecimal:
              pattern: ^(?:0|[1-9][0-9]*)(?![\s\S])
              type: string
            ProvenanceEntryId:
              pattern: ^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?![\s\S])
              type: string
            ProvenanceId:
              pattern: ^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?![\s\S])
              type: string
            ProvenanceJournalId:
              pattern: ^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?![\s\S])
              type: string
            Sha256:
              pattern: ^[0-9a-f]{64}(?![\s\S])
              type: string
          additionalProperties: false
          properties:
            artifacts:
              items:
                $ref: '#/$defs/CoreProvenanceFact'
              minItems: 1
              title: Artifacts
              type: array
          required:
          - artifacts
          title: CoreProvenanceFacts
          type: object
          $schema: https://json-schema.org/draft/2020-12/schema
      facts_semantics:
        id: stove0.riverhog-provenance-facts-semantics/v1
