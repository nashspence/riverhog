x-riverhog-environment: &riverhog-environment
  RIVERHOG_CONFIG: /etc/riverhog/config.yaml

services:
  garage:
    profiles: ["development"]
    image: dxflrs/garage:b72b090a097c8ee2711c8fb065d250ed68dcd0bf@sha256:f22f09abe741e54ab244e95638310e040b81eda41e2c6ab9b7373cda4b9e955c
    volumes:
      - garage-data:/var/lib/garage
      - ../tests/harness/garage.toml:/etc/garage.toml:ro

  archive-adapter:
    profiles: ["development"]
    image: riverhog-test:dev
    build:
      context: ..
      dockerfile: tests/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    entrypoint: ["python", "-m", "tests.harness.garage_storage_adapter"]
    environment:
      RIVERHOG_GARAGE_STORAGE_ADAPTER_TOKEN: ${RIVERHOG_GARAGE_STORAGE_ADAPTER_TOKEN:-riverhog-development-storage-adapter-token}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_ENDPOINT_URL: ${RIVERHOG_GARAGE_STORAGE_ADAPTER_ENDPOINT_URL:-http://garage:3900}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_REGION: ${RIVERHOG_GARAGE_STORAGE_ADAPTER_REGION:-garage}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_BUCKET: ${RIVERHOG_GARAGE_ARCHIVE_BUCKET:-riverhog-archive}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_ACCESS_KEY_ID: ${RIVERHOG_GARAGE_ARCHIVE_ACCESS_KEY_ID:-GK000000000000000000000002}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_SECRET_ACCESS_KEY: ${RIVERHOG_GARAGE_ARCHIVE_SECRET_ACCESS_KEY:-2222222222222222222222222222222222222222222222222222222222222222}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_READ_MODE: ${RIVERHOG_GARAGE_ARCHIVE_READ_MODE:-restore_required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  filesystem-cache-init:
    profiles: ["development"]
    image: ${A_RIVERHOG_FILESYSTEM_STORE_IMAGE_REF:-a-riverhog-filesystem-store:dev}
    build:
      context: ..
      dockerfile: some-implementations/riverhog/storage/filesystem/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: "no"
    command: ["python", "-m", "a_riverhog_filesystem_store.incarnation", "/var/lib/riverhog-filesystem"]
    volumes:
      - filesystem-cache-data:/var/lib/riverhog-filesystem

  filesystem-cache-adapter:
    profiles: ["development"]
    image: ${A_RIVERHOG_FILESYSTEM_STORE_IMAGE_REF:-a-riverhog-filesystem-store:dev}
    build:
      context: ..
      dockerfile: some-implementations/riverhog/storage/filesystem/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    depends_on:
      filesystem-cache-init:
        condition: service_completed_successfully
    environment:
      A_RIVERHOG_FILESYSTEM_STORE_TOKEN_FILE: /run/secrets/riverhog-storage-adapter.token
      A_RIVERHOG_FILESYSTEM_STORE_ROOT: /var/lib/riverhog-filesystem
      A_RIVERHOG_FILESYSTEM_STORE_MINIMUM_FREE_BYTES: ${A_RIVERHOG_FILESYSTEM_STORE_MINIMUM_FREE_BYTES:-0B}
    volumes:
      - filesystem-cache-data:/var/lib/riverhog-filesystem
      - type: bind
        source: ${RIVERHOG_STORAGE_ADAPTER_TOKEN_HOST_PATH:-../tests/harness/garage-storage-adapter.token}
        target: /run/secrets/riverhog-storage-adapter.token
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  elastic-cache-adapter:
    profiles: ["development"]
    image: riverhog-test:dev
    build:
      context: ..
      dockerfile: tests/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    entrypoint: ["python", "-m", "tests.harness.garage_storage_adapter"]
    environment:
      RIVERHOG_GARAGE_STORAGE_ADAPTER_TOKEN: ${RIVERHOG_GARAGE_STORAGE_ADAPTER_TOKEN:-riverhog-development-storage-adapter-token}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_ENDPOINT_URL: ${RIVERHOG_GARAGE_STORAGE_ADAPTER_ENDPOINT_URL:-http://garage:3900}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_REGION: ${RIVERHOG_GARAGE_STORAGE_ADAPTER_REGION:-garage}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_BUCKET: ${RIVERHOG_GARAGE_CACHE_BUCKET:-riverhog-cache}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_ACCESS_KEY_ID: ${RIVERHOG_GARAGE_CACHE_ACCESS_KEY_ID:-GK000000000000000000000002}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_SECRET_ACCESS_KEY: ${RIVERHOG_GARAGE_CACHE_SECRET_ACCESS_KEY:-2222222222222222222222222222222222222222222222222222222222222222}
      RIVERHOG_GARAGE_STORAGE_ADAPTER_READ_MODE: immediate
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riverhog}
      POSTGRES_USER: ${POSTGRES_USER:-riverhog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riverhog}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"${POSTGRES_USER:-riverhog}\" -d \"${POSTGRES_DB:-riverhog}\"",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init/10-riverhog-prerequisites.sql:/docker-entrypoint-initdb.d/10-riverhog-prerequisites.sql:ro

  state:
    image: ${RIVERHOG_IMAGE_REF:-riverhog-app:dev}
    build:
      context: ..
      dockerfile: riverhog/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *riverhog-environment
    command: ["state", "upgrade"]
    volumes:
      - ${RIVERHOG_CONFIG_HOST_PATH:-../qualification/fixtures/riverhog/config.yaml}:/etc/riverhog/config.yaml:ro
      - ${RIVERHOG_DATABASE_URL_HOST_PATH:-../tests/harness/riverhog-database-url}:/run/secrets/riverhog-database-url:ro

  app:
    image: ${RIVERHOG_IMAGE_REF:-riverhog-app:dev}
    build:
      context: ..
      dockerfile: riverhog/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
    depends_on:
      postgres:
        condition: service_healthy
      state:
        condition: service_completed_successfully
    environment: *riverhog-environment
    volumes:
      - ${RIVERHOG_CONFIG_HOST_PATH:-../qualification/fixtures/riverhog/config.yaml}:/etc/riverhog/config.yaml:ro
      - ${RIVERHOG_DATABASE_URL_HOST_PATH:-../tests/harness/riverhog-database-url}:/run/secrets/riverhog-database-url:ro
      - ${RIVERHOG_BOOTSTRAP_TOKEN_HOST_PATH:-../tests/harness/riverhog-bootstrap-token}:/run/secrets/riverhog-bootstrap-token:ro
      - ${RIVERHOG_BROWSE_KEY_HOST_PATH:-../tests/harness/riverhog-browse-key}:/run/secrets/riverhog-browse-key:ro
      - ${RIVERHOG_ARCHIVE_PASSPHRASE_HOST_PATH:-../tests/harness/riverhog-archive-passphrase}:/run/secrets/riverhog-archive-passphrase:ro
      - type: bind
        source: ${RIVERHOG_STORAGE_ADAPTER_TOKEN_HOST_PATH:-../tests/harness/garage-storage-adapter.token}
        target: /run/secrets/riverhog-storage-adapter.token
        read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; payload = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready')); assert payload == {'service': 'riverhog', 'status': 'ok'}",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    ports:
      - "${RIVERHOG_API_BIND_ADDR:-127.0.0.1}:${RIVERHOG_API_PORT:-8000}:8000"
  test:
    image: riverhog-test:dev
    build:
      context: ..
      dockerfile: tests/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    environment:
      <<: *riverhog-environment
      PYTHONPATH: /workspace
    volumes:
      - ..:/workspace
      - ${RIVERHOG_CONFIG_HOST_PATH:-../qualification/fixtures/riverhog/config.yaml}:/etc/riverhog/config.yaml:ro
      - ${RIVERHOG_DATABASE_URL_HOST_PATH:-../tests/harness/riverhog-database-url}:/run/secrets/riverhog-database-url:ro
      - ${RIVERHOG_BOOTSTRAP_TOKEN_HOST_PATH:-../tests/harness/riverhog-bootstrap-token}:/run/secrets/riverhog-bootstrap-token:ro
      - ${RIVERHOG_BROWSE_KEY_HOST_PATH:-../tests/harness/riverhog-browse-key}:/run/secrets/riverhog-browse-key:ro
      - ${RIVERHOG_ARCHIVE_PASSPHRASE_HOST_PATH:-../tests/harness/riverhog-archive-passphrase}:/run/secrets/riverhog-archive-passphrase:ro
      - type: bind
        source: ${RIVERHOG_STORAGE_ADAPTER_TOKEN_HOST_PATH:-../tests/harness/garage-storage-adapter.token}
        target: /run/secrets/riverhog-storage-adapter.token
        read_only: true

volumes:
  filesystem-cache-data:
  garage-data:
  postgres-data:
