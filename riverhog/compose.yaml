x-riverhog-environment: &riverhog-environment
  RIVERHOG_CONFIG: /etc/riverhog/config.yaml
  TZ: ${TZ:-UTC}

x-riverhog-hardening: &riverhog-hardening
  read_only: true
  user: "65532:65532"
  group_add: ["${RIVERHOG_SECRET_FILE_GID:-65532}"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

services:
  s3-fixture:
    profiles: ["development"]
    image: cgr.dev/chainguard/minio:latest@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
    user: "0:0"
    command: ["--quiet", "--anonymous", "server", "/data"]
    environment:
      MINIO_ROOT_USER: ${RIVERHOG_S3_FIXTURE_ACCESS_KEY_ID:-riverhog-test-key}
      MINIO_ROOT_PASSWORD: ${RIVERHOG_S3_FIXTURE_SECRET_ACCESS_KEY:-riverhog-test-secret}
    volumes:
      - s3-fixture-data:/data

  archive-adapter:
    profiles: ["development"]
    image: riverhog-test:dev
    build:
      context: ..
      dockerfile: tests/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    entrypoint: ["python", "-m", "tests.harness.s3_storage_adapter"]
    environment:
      RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_TOKEN: ${RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_TOKEN:-riverhog-development-storage-adapter-token}
      RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_ENDPOINT_URL: ${RIVERHOG_S3_FIXTURE_ENDPOINT_URL:-http://s3-fixture:9000}
      RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_REGION: ${RIVERHOG_S3_FIXTURE_REGION:-us-east-1}
      RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_BUCKET: ${RIVERHOG_S3_FIXTURE_ARCHIVE_BUCKET:-riverhog-archive}
      RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_ACCESS_KEY_ID: ${RIVERHOG_S3_FIXTURE_ACCESS_KEY_ID:-riverhog-test-key}
      RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_SECRET_ACCESS_KEY: ${RIVERHOG_S3_FIXTURE_SECRET_ACCESS_KEY:-riverhog-test-secret}
      RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_READ_MODE: ${RIVERHOG_S3_FIXTURE_ARCHIVE_READ_MODE:-restore_required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  filesystem-cache-init:
    profiles: ["development"]
    image: ${A_RIVERHOG_FILESYSTEM_STORE_IMAGE_REF:-a-riverhog-filesystem-store:dev}
    build:
      context: ..
      dockerfile: some-implementations/riverhog/storage/filesystem/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: "no"
    command: ["python", "-m", "a_riverhog_filesystem_store.incarnation", "/var/lib/riverhog-filesystem"]
    volumes:
      - filesystem-cache-data:/var/lib/riverhog-filesystem

  filesystem-cache-adapter:
    profiles: ["development"]
    image: ${A_RIVERHOG_FILESYSTEM_STORE_IMAGE_REF:-a-riverhog-filesystem-store:dev}
    build:
      context: ..
      dockerfile: some-implementations/riverhog/storage/filesystem/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    depends_on:
      filesystem-cache-init:
        condition: service_completed_successfully
    environment:
      A_RIVERHOG_FILESYSTEM_STORE_TOKEN_FILE: /run/secrets/riverhog-storage-adapter.token
      A_RIVERHOG_FILESYSTEM_STORE_ROOT: /var/lib/riverhog-filesystem
      A_RIVERHOG_FILESYSTEM_STORE_MINIMUM_FREE_BYTES: ${A_RIVERHOG_FILESYSTEM_STORE_MINIMUM_FREE_BYTES:-0B}
    volumes:
      - filesystem-cache-data:/var/lib/riverhog-filesystem
      - type: bind
        source: ${RIVERHOG_STORAGE_ADAPTER_TOKEN_HOST_PATH:-../tests/harness/s3-storage-adapter.token}
        target: /run/secrets/riverhog-storage-adapter.token
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  elastic-cache-adapter:
    profiles: ["development"]
    image: riverhog-test:dev
    build:
      context: ..
      dockerfile: tests/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    entrypoint: ["python", "-m", "tests.harness.s3_storage_adapter"]
    environment:
      RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_TOKEN: ${RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_TOKEN:-riverhog-development-storage-adapter-token}
      RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_ENDPOINT_URL: ${RIVERHOG_S3_FIXTURE_ENDPOINT_URL:-http://s3-fixture:9000}
      RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_REGION: ${RIVERHOG_S3_FIXTURE_REGION:-us-east-1}
      RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_BUCKET: ${RIVERHOG_S3_FIXTURE_CACHE_BUCKET:-riverhog-cache}
      RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_ACCESS_KEY_ID: ${RIVERHOG_S3_FIXTURE_ACCESS_KEY_ID:-riverhog-test-key}
      RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_SECRET_ACCESS_KEY: ${RIVERHOG_S3_FIXTURE_SECRET_ACCESS_KEY:-riverhog-test-secret}
      RIVERHOG_S3_FIXTURE_STORAGE_ADAPTER_READ_MODE: immediate
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riverhog}
      POSTGRES_USER: ${POSTGRES_USER:-riverhog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riverhog}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"${POSTGRES_USER:-riverhog}\" -d \"${POSTGRES_DB:-riverhog}\"",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init/10-riverhog-prerequisites.sql:/docker-entrypoint-initdb.d/10-riverhog-prerequisites.sql:ro

  state:
    <<: *riverhog-hardening
    image: ${RIVERHOG_IMAGE_REF:-riverhog-app:dev}
    build:
      context: ..
      dockerfile: riverhog/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: "no"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *riverhog-environment
    command: ["state", "upgrade"]
    volumes:
      - scratch:/scratch:rw
      - ${RIVERHOG_CONFIG_HOST_PATH:-../qualification/fixtures/riverhog/config.yaml}:/etc/riverhog/config.yaml:ro
      - ${RIVERHOG_DATABASE_URL_HOST_PATH:-../tests/harness/riverhog-database-url}:/run/secrets/riverhog-database-url:ro

  app:
    <<: *riverhog-hardening
    image: ${RIVERHOG_IMAGE_REF:-riverhog-app:dev}
    build:
      context: ..
      dockerfile: riverhog/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532,size=64m
    depends_on:
      postgres:
        condition: service_healthy
      state:
        condition: service_completed_successfully
    environment: *riverhog-environment
    volumes:
      - scratch:/scratch:rw
      - ${RIVERHOG_CONFIG_HOST_PATH:-../qualification/fixtures/riverhog/config.yaml}:/etc/riverhog/config.yaml:ro
      - ${RIVERHOG_DATABASE_URL_HOST_PATH:-../tests/harness/riverhog-database-url}:/run/secrets/riverhog-database-url:ro
      - ${RIVERHOG_BOOTSTRAP_TOKEN_HOST_PATH:-../tests/harness/riverhog-bootstrap-token}:/run/secrets/riverhog-bootstrap-token:ro
      - ${RIVERHOG_BROWSE_KEY_HOST_PATH:-../tests/harness/riverhog-browse-key}:/run/secrets/riverhog-browse-key:ro
      - ${RIVERHOG_ARCHIVE_PASSPHRASE_HOST_PATH:-../tests/harness/riverhog-archive-passphrase}:/run/secrets/riverhog-archive-passphrase:ro
      - type: bind
        source: ${RIVERHOG_STORAGE_ADAPTER_TOKEN_HOST_PATH:-../tests/harness/s3-storage-adapter.token}
        target: /run/secrets/riverhog-storage-adapter.token
        read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; payload = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready')); assert payload == {'service': 'riverhog', 'status': 'ok'}",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    ports:
      - "${RIVERHOG_API_BIND_ADDR:-127.0.0.1}:${RIVERHOG_API_PORT:-8000}:8000"
  test:
    image: riverhog-test:dev
    build:
      context: ..
      dockerfile: tests/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    environment:
      <<: *riverhog-environment
      PYTHONPATH: /workspace
    volumes:
      - ..:/workspace
      - ${RIVERHOG_CONFIG_HOST_PATH:-../qualification/fixtures/riverhog/config.yaml}:/etc/riverhog/config.yaml:ro
      - ${RIVERHOG_DATABASE_URL_HOST_PATH:-../tests/harness/riverhog-database-url}:/run/secrets/riverhog-database-url:ro
      - ${RIVERHOG_BOOTSTRAP_TOKEN_HOST_PATH:-../tests/harness/riverhog-bootstrap-token}:/run/secrets/riverhog-bootstrap-token:ro
      - ${RIVERHOG_BROWSE_KEY_HOST_PATH:-../tests/harness/riverhog-browse-key}:/run/secrets/riverhog-browse-key:ro
      - ${RIVERHOG_ARCHIVE_PASSPHRASE_HOST_PATH:-../tests/harness/riverhog-archive-passphrase}:/run/secrets/riverhog-archive-passphrase:ro
      - type: bind
        source: ${RIVERHOG_STORAGE_ADAPTER_TOKEN_HOST_PATH:-../tests/harness/s3-storage-adapter.token}
        target: /run/secrets/riverhog-storage-adapter.token
        read_only: true

volumes:
  scratch:
  filesystem-cache-data:
  s3-fixture-data:
  postgres-data:
