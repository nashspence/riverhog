[[heuristics]]
id = "structured-authority-dependency-liveness"
guidance = """
Prefer establishing successor protection for referenced immutable dependencies before
releasing predecessor protection; distinguish content equality from retained storage.
"""
scope = """
Design and maintenance of collection-tag authority whose nodes can be reclaimed
independently.
"""
rationale = """
This favors explicit lifetime accounting across reuse, publication, and reclamation. Any
actual retention promise remains independently defined.
"""

