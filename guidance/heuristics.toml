[[heuristics]]
id = "derive-references-from-canonical-sources"
guidance = """
Prefer generating secondary reference material and checking it against its established
executable source instead of keeping a parallel hand-maintained inventory.
"""
scope = """
Design of repository reference generators and release-installation outputs; consider the
same approach when adding documentation about existing contract surfaces.
"""
rationale = """
This reduces opportunities for competing descriptions to diverge. The guidance neither
appoints a source as contractual authority nor makes a generated document contractual.
"""

[[heuristics.related_tests]]
node = "tests/unit/test_release_installation.py::test_installation_artifacts_are_derived_and_mutually_consistent"
note = """
Builds and verifies fixture installation artifacts, manifest relationships, and reference
content; the external-lock export is stubbed. This is not a real-platform installation
result.
"""

[[heuristics]]
id = "scope-evidence-to-what-was-exercised"
guidance = """
Prefer describing a check at the level it actually exercises, distinguishing structural
correspondence, fake-client checks, live behavior, and exact-run results.
"""
scope = """
Maintenance of qualification reporting and cross-interface parity explanations; related test
links in this register remain contextual only.
"""
rationale = """
This avoids turning test presence or a narrow successful response into a broader assurance.
Evidence required by an actual contract is still handled independently.
"""

