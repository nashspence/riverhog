# The schema is an internal register format, not a product contract.
schema = "riverhog-nonbinding-guidance/v1"

[[heuristics]]
id = "exact-external-effect-authority"
guidance = """
Prefer sealing explicit intent and acquiring destination-specific ownership before starting
an external effect; use that same attempt when reconciling ambiguous outcomes.
"""
scope = """
Design and maintenance of collection-description and collection-tag-head publication where
database acceptance and provider I/O cannot commit atomically.
"""
rationale = """
This favors a design in which delayed work and retries remain attributable to one intended
effect. It does not prescribe a public protocol or weaken independently required
correctness.
"""

