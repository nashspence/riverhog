services:
  qualification-filesystem-cache-init:
    image: a-riverhog-filesystem-store:dev
    restart: "no"
    command: ["python", "-m", "a_riverhog_filesystem_store.incarnation", "/var/lib/riverhog-filesystem"]
    volumes:
      - qualification-filesystem-cache-data:/var/lib/riverhog-filesystem

  qualification-filesystem-cache-adapter:
    image: a-riverhog-filesystem-store:dev
    restart: unless-stopped
    group_add: ["${RIVERHOG_QUALIFICATION_SECRET_GID}"]
    depends_on:
      qualification-filesystem-cache-init:
        condition: service_completed_successfully
    environment:
      A_RIVERHOG_FILESYSTEM_STORE_TOKEN_FILE: /run/secrets/riverhog-storage-adapter.token
      A_RIVERHOG_FILESYSTEM_STORE_ROOT: /var/lib/riverhog-filesystem
      A_RIVERHOG_FILESYSTEM_STORE_MINIMUM_FREE_BYTES: 0B
    volumes:
      - qualification-filesystem-cache-data:/var/lib/riverhog-filesystem
      - type: bind
        source: ${RIVERHOG_STORAGE_ADAPTER_TOKEN_HOST_PATH}
        target: /run/secrets/riverhog-storage-adapter.token
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  aws-deep-archive-adapter:
    image: a-riverhog-aws-store:dev
    restart: unless-stopped
    group_add: ["${RIVERHOG_QUALIFICATION_SECRET_GID}"]
    environment:
      A_RIVERHOG_AWS_STORE_CONFIG: /etc/riverhog/aws-store.yaml
    volumes:
      - ${A_RIVERHOG_AWS_STORE_CONFIG_HOST_PATH}:/etc/riverhog/aws-store.yaml:ro
      - ${A_RIVERHOG_AWS_STORE_ACCESS_KEY_ID_HOST_PATH}:/run/secrets/aws-access-key-id:ro
      - ${A_RIVERHOG_AWS_STORE_SECRET_ACCESS_KEY_HOST_PATH}:/run/secrets/aws-secret-access-key:ro
      - ${A_RIVERHOG_AWS_STORE_SESSION_TOKEN_HOST_PATH}:/run/secrets/aws-session-token:ro
      - type: bind
        source: ${RIVERHOG_STORAGE_ADAPTER_TOKEN_HOST_PATH}
        target: /run/secrets/riverhog-storage-adapter.token
        read_only: true
      - type: bind
        source: ${A_RIVERHOG_AWS_STORE_CLOUDFRONT_PRIVATE_KEY_HOST_PATH}
        target: /run/secrets/riverhog-cloudfront.pem
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  b2-archive-adapter:
    image: a-riverhog-b2-store:dev
    restart: unless-stopped
    group_add: ["${RIVERHOG_QUALIFICATION_SECRET_GID}"]
    environment:
      A_RIVERHOG_B2_STORE_CONFIG: /etc/riverhog/b2-store.yaml
    volumes:
      - ${A_RIVERHOG_B2_ARCHIVE_CONFIG_HOST_PATH}:/etc/riverhog/b2-store.yaml:ro
      - ${A_RIVERHOG_B2_ARCHIVE_ACCESS_KEY_ID_HOST_PATH}:/run/secrets/b2-archive-access-key-id:ro
      - ${A_RIVERHOG_B2_ARCHIVE_SECRET_ACCESS_KEY_HOST_PATH}:/run/secrets/b2-archive-secret-access-key:ro
      - type: bind
        source: ${RIVERHOG_STORAGE_ADAPTER_TOKEN_HOST_PATH}
        target: /run/secrets/riverhog-storage-adapter.token
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  b2-retrieval-cache-adapter:
    image: a-riverhog-b2-store:dev
    restart: unless-stopped
    group_add: ["${RIVERHOG_QUALIFICATION_SECRET_GID}"]
    environment:
      A_RIVERHOG_B2_STORE_CONFIG: /etc/riverhog/b2-store.yaml
    volumes:
      - ${A_RIVERHOG_B2_CACHE_CONFIG_HOST_PATH}:/etc/riverhog/b2-store.yaml:ro
      - ${A_RIVERHOG_B2_CACHE_ACCESS_KEY_ID_HOST_PATH}:/run/secrets/b2-cache-access-key-id:ro
      - ${A_RIVERHOG_B2_CACHE_SECRET_ACCESS_KEY_HOST_PATH}:/run/secrets/b2-cache-secret-access-key:ro
      - type: bind
        source: ${RIVERHOG_STORAGE_ADAPTER_TOKEN_HOST_PATH}
        target: /run/secrets/riverhog-storage-adapter.token
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  app:
    group_add: ["${RIVERHOG_QUALIFICATION_SECRET_GID}"]
    depends_on:
      qualification-filesystem-cache-adapter:
        condition: service_healthy
      aws-deep-archive-adapter:
        condition: service_healthy
      b2-archive-adapter:
        condition: service_healthy
      b2-retrieval-cache-adapter:
        condition: service_healthy

  state:
    group_add: ["${RIVERHOG_QUALIFICATION_SECRET_GID}"]

  test:
    group_add: ["${RIVERHOG_QUALIFICATION_SECRET_GID}"]

volumes:
  qualification-filesystem-cache-data:
