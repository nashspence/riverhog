x-ftp-adapter-image: &ftp-adapter-image
  image: riverhog-ftp-adapter:dev
  build:
    context: ../../../..
    dockerfile: reference/riverhog/ingress/ftp/Dockerfile
    args:
      SOURCE_REVISION: ${SOURCE_REVISION:-unknown}

services:
  intake-init:
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    restart: "no"
    environment:
      INTAKE_GID: ${RIVERHOG_FTP_ADAPTER_INTAKE_GID:-65532}
    command:
      - sh
      - -c
      - >-
        install -d -o 65532 -g "$${INTAKE_GID}" -m 2770 /intake /intake/ftp
    volumes:
      - type: bind
        source: ${RIVERHOG_FTP_ADAPTER_INTAKE_HOST_DIR:-./runtime/intake}
        target: /intake

  ftp-adapter:
    <<: *ftp-adapter-image
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    group_add:
      - "${RIVERHOG_FTP_ADAPTER_SECRET_FILE_GID:-65532}"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      intake-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-UTC}
      RIVERHOG_FTP_ADAPTER_CONFIG: /etc/riverhog/ftp-adapter.json
      RIVERHOG_TOKEN_FILE: /run/secrets/riverhog_token
      RIVERHOG_FTP_ADAPTER_API_TOKEN_FILE: /run/secrets/api_token
    secrets:
      - riverhog_token
      - api_token
    volumes:
      - type: bind
        source: ${RIVERHOG_FTP_ADAPTER_CONFIG_HOST_PATH:?RIVERHOG_FTP_ADAPTER_CONFIG_HOST_PATH is required}
        target: /etc/riverhog/ftp-adapter.json
        read_only: true
      - type: bind
        source: ${RIVERHOG_FTP_ADAPTER_INTAKE_HOST_DIR:-./runtime/intake}
        target: /intake
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
    networks: ["default", "riverhog-control"]
    ports:
      - "${RIVERHOG_FTP_ADAPTER_API_BIND_ADDR:-127.0.0.1}:${RIVERHOG_FTP_ADAPTER_API_PORT:-8082}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          payload = json.load(urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5));
          assert payload == {'service': 'riverhog-ftp-adapter', 'status': 'ok'}
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  ftp-listener:
    <<: *ftp-adapter-image
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    group_add:
      - "${RIVERHOG_FTP_ADAPTER_SECRET_FILE_GID:-65532}"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      intake-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-UTC}
      RIVERHOG_FTP_ADAPTER_CONFIG: /etc/riverhog/ftp-adapter.json
    secrets: ["ftp_password"]
    command:
      - riverhog-ftp-adapter
      - --config
      - /etc/riverhog/ftp-adapter.json
      - listen
      - --source
      - ${RIVERHOG_FTP_ADAPTER_SOURCE_ID:-ftp-intake}
      - --username
      - ${RIVERHOG_FTP_ADAPTER_USERNAME:-ftp-intake}
      - --password-file
      - /run/secrets/ftp_password
      - --host
      - 0.0.0.0
      - --port
      - "2121"
      - --passive-port-start
      - ${RIVERHOG_FTP_ADAPTER_PASSIVE_PORT_START:-30000}
      - --passive-port-end
      - ${RIVERHOG_FTP_ADAPTER_PASSIVE_PORT_END:-30039}
      - --public-host
      - ${RIVERHOG_FTP_ADAPTER_PUBLIC_HOST:-}
      - --max-connections
      - ${RIVERHOG_FTP_ADAPTER_MAX_CONNECTIONS:-256}
      - --max-connections-per-ip
      - ${RIVERHOG_FTP_ADAPTER_MAX_CONNECTIONS_PER_IP:-32}
    ports:
      - "${RIVERHOG_FTP_ADAPTER_INGRESS_BIND_ADDR:-127.0.0.1}:${RIVERHOG_FTP_ADAPTER_PORT:-21}:2121"
      - "${RIVERHOG_FTP_ADAPTER_INGRESS_BIND_ADDR:-127.0.0.1}:${RIVERHOG_FTP_ADAPTER_PASSIVE_PORT_START:-30000}-${RIVERHOG_FTP_ADAPTER_PASSIVE_PORT_END:-30039}:30000-30039"
    volumes:
      - type: bind
        source: ${RIVERHOG_FTP_ADAPTER_CONFIG_HOST_PATH:?RIVERHOG_FTP_ADAPTER_CONFIG_HOST_PATH is required}
        target: /etc/riverhog/ftp-adapter.json
        read_only: true
      - type: bind
        source: ${RIVERHOG_FTP_ADAPTER_INTAKE_HOST_DIR:-./runtime/intake}
        target: /intake
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=700,uid=65532,gid=65532
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          socket.create_connection(('127.0.0.1', 2121), timeout=5).close()
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 5s

secrets:
  riverhog_token:
    file: ${RIVERHOG_FTP_ADAPTER_RIVERHOG_TOKEN_FILE:?RIVERHOG_FTP_ADAPTER_RIVERHOG_TOKEN_FILE is required}
  api_token:
    file: ${RIVERHOG_FTP_ADAPTER_API_TOKEN_FILE:?RIVERHOG_FTP_ADAPTER_API_TOKEN_FILE is required}
  ftp_password:
    file: ${RIVERHOG_FTP_ADAPTER_PASSWORD_FILE:-./secrets/ftp_password}

networks:
  riverhog-control:
    external: true
    name: ${RIVERHOG_CONTROL_NETWORK:-riverhog_default}
