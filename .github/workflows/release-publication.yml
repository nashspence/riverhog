name: Release publication

on:
  workflow_dispatch:
    inputs:
      preparation_run:
        description: Successful reviewed release-preparation run ID; dispatch from its pre-approved v1 tag.
        required: true
        type: string
      qualification_run:
        description: Successful exact-source release-qualification run ID bound by preparation.
        required: true
        type: string
      checksums_signature:
        description: Detached Minisign signature produced offline from the reviewed preparation's exact SHA256SUMS.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: riverhog-release-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Verify reviewed assets and publish immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release-publication
    steps:
      - name: Check out approved tag and authoring history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install repository toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: python uv minisign
      - name: Verify reviewed assets and offline maintainer signature
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          CHECKSUMS_SIGNATURE: ${{ inputs.checksums_signature }}
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_MINISIGN_PUBLIC_KEY }}
          PREPARATION_RUN: ${{ inputs.preparation_run }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
        run: |
          umask 077
          approval="$RUNNER_TEMP/release-approval"
          mkdir "$approval"
          trap 'rm -rf "$approval"' EXIT
          if [[ -z "$RELEASE_PUBLIC_KEY" ]]; then
            printf 'Configure RELEASE_MINISIGN_PUBLIC_KEY in the protected release-publication environment.\n' >&2
            exit 2
          fi
          printf '%s\n' "$CHECKSUMS_SIGNATURE" > "$approval/SHA256SUMS.minisig"
          printf '%s\n' "$RELEASE_PUBLIC_KEY" > "$approval/release.pub"
          mise x -- uv run --locked --group dev python scripts/workflow_evidence.py download \
            --kind preparation --run-id "$PREPARATION_RUN" --source-sha "$GITHUB_SHA" \
            --version "${GITHUB_REF#refs/tags/v}" --output "$RUNNER_TEMP/reviewed-preparation"
          mise x -- uv run --locked --all-packages --group dev python scripts/release.py publish \
            --directory "$RUNNER_TEMP/reviewed-preparation/evidence" \
            --preparation-public-key "$RUNNER_TEMP/reviewed-preparation/evidence.preparation.pub" \
            --preparation-run "$PREPARATION_RUN" --qualification-run "$QUALIFICATION_RUN" \
            --checksums-signature "$approval/SHA256SUMS.minisig" --public-key "$approval/release.pub"
