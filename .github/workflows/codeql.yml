name: CodeQL

on:
  pull_request:
    branches:
      - main
      - release/v1
  push:
    branches:
      - main
      - release/v1
  schedule:
    - cron: "41 6 * * 4"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VALIDATION_WORK: codeql-${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record exact checkout before analysis
        env:
          VALIDATION_CHECKOUT: ${{ runner.temp }}/codeql-validation/checkout.json
        run: python3 scripts/ci_execution.py start --work "$VALIDATION_WORK" --output "$VALIDATION_CHECKOUT"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze repository
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: /language:${{ matrix.language }}
      - name: Close exact checkout after analysis
        env:
          VALIDATION_CHECKOUT: ${{ runner.temp }}/codeql-validation/checkout.json
        if: always()
        run: python3 scripts/ci_execution.py finish --work "$VALIDATION_WORK" --output "$VALIDATION_CHECKOUT"
      - name: Retain exact analysis source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validation-codeql-${{ matrix.language }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-validation
          if-no-files-found: error
          retention-days: 7
