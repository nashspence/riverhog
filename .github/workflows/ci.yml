name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/v1
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check out and validate.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: make ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: lint
          - target: compile
          - target: unit
          - target: c2sp-vectors
          - target: postgres-concurrency
            docker: true
          - target: compose-smoke
            docker: true
          - target: filesystem-recovery-qualification
            docker: true
          - target: dist-smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Configure Docker engine
        if: matrix.docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.3.1
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Install Docker Compose
        if: matrix.docker
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.1.1
      - name: Run repository target
        env:
          CI_TARGET: ${{ matrix.target }}
        run: make "$CI_TARGET"

  client-platforms:
    name: client platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MISE_AUTO_INSTALL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            listener_repetitions: 12
          - os: macos-15
            listener_repetitions: 12
          - os: windows-2025
            listener_repetitions: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: python uv age
      - name: Qualify native end-user behavior
        run: >-
          mise x python uv age -- uv run --locked --all-packages --group dev
          python -m pytest -q
          packages/riverhog-provenance/tests/test_platform_live.py
          some-implementations/gogurt/application/tests
          tests/platform/test_end_user_artifacts.py
      - name: Qualify independent staged uv-tool installs
        run: >-
          mise x python uv age -- uv run --locked --all-packages --group dev
          python scripts/qualify_installation.py --version 1.0.0 --listener-lifecycle
          --listener-lifecycle-repetitions ${{ matrix.listener_repetitions }}
          --gogurt-evidence-dir "${{ runner.temp }}/gogurt-failure-evidence"
      - name: Retain bounded Gogurt lifecycle failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gogurt-lifecycle-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/gogurt-failure-evidence
          if-no-files-found: warn
          retention-days: 14

  images:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    strategy:
      fail-fast: false
      matrix:
        target:
          - riverhog
          - a-riverhog-ftp-spool
          - a-riverhog-aws-store
          - a-riverhog-b2-store
          - a-riverhog-filesystem-store
          - stove0
          - a-stove0-exiftool-observer
          - a-stove0-ffprobe-sampling-observer
          - a-stove0-nvenc-av1-opus-target
          - a-stove0-opus-target
          - a-review0-materializer
          - a-review0-rclone-target
          - a-riverhog-event-relay
          - a-riverhog-minisign-witness
          - a-riverhog-opentimestamps-witness
          - test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Configure Docker engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.3.1
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Install Docker Compose for deployable companion smoke
        if: startsWith(matrix.target, 'a-riverhog-') && matrix.target != 'a-riverhog-ftp-spool'
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.36.0
          driver: docker
      - name: Install Riverhog event relay smoke toolchain
        if: matrix.target == 'a-riverhog-event-relay'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: python
      - name: Resolve image metadata
        id: image-metadata
        run: |
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          load: true
          set: |
            *.args.SOURCE_REVISION=${{ inputs.ref || github.sha }}
            *.args.BUILD_CREATED=${{ steps.image-metadata.outputs.created }}
            *.args.SOURCE_DATE_EPOCH=0
            *.args.RELEASE_VERSION=development
            *.cache-from=type=gha,scope=${{ matrix.target }}
            *.cache-to=type=gha,scope=${{ matrix.target }},mode=max,ignore-error=true
      - name: Smoke Riverhog event relay image
        if: matrix.target == 'a-riverhog-event-relay'
        run: make a-riverhog-event-relay-smoke
      - name: Smoke independent witness image
        if: matrix.target == 'a-riverhog-minisign-witness' || matrix.target == 'a-riverhog-opentimestamps-witness'
        env:
          IMAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/test_witness_image.py "$IMAGE_TARGET"
      - name: Smoke supported Compose deployment
        if: startsWith(matrix.target, 'a-riverhog-') && matrix.target != 'a-riverhog-ftp-spool'
        env:
          IMAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/test_runtime_compose.py "$IMAGE_TARGET"
      - name: Verify runtime image isolation
        if: matrix.target != 'test'
        env:
          IMAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/check_runtime_image.py "$IMAGE_TARGET"
