name: CI
'on':
  pull_request:
  push:
    branches:
      - main
      - release/v1
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check out and validate.
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: CI gate
    if: always()
    needs:
      - plan
      - repository
      - units
      - compose
      - client-platforms
      - images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every mandatory qualification to succeed
        env:
          CI_DEPENDENCIES: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          dependencies = json.loads(os.environ["CI_DEPENDENCIES"])
          failed = {name: value.get("result") for name, value in dependencies.items()
                    if value.get("result") != "success"}
          if not dependencies or failed:
              raise SystemExit(f"Mandatory qualification did not succeed: {failed}")
          print("Every mandatory qualification succeeded.")
          PY
  plan:
    name: Qualification plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      repository: ${{ steps.plan.outputs.repository }}
      units: ${{ steps.plan.outputs.units }}
      compose: ${{ steps.plan.outputs.compose }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
      - name: Derive complete execution matrices from maintained targets
        id: plan
        run: mise x -- uv run --locked --all-packages --group dev python -m scripts.ci_qualification plan --github-output
          "$GITHUB_OUTPUT"
  repository:
    name: make ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.repository) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
      - name: Configure Docker engine
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1
        with:
          version: v29.3.1
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
        if: matrix.docker
      - name: Install Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2
        with:
          version: v5.1.1
        if: matrix.docker
      - name: Run repository target
        env:
          CI_TARGET: ${{ matrix.target }}
          RIVERHOG_CI_TIMING_DIR: ${{ runner.temp }}/ci-timing
        run: mise x -- uv run --locked --all-packages --group dev python scripts/ci_timing.py run --lane "$CI_TARGET" --output
          "$RIVERHOG_CI_TIMING_DIR/$CI_TARGET/lane.json" -- make "$CI_TARGET"
      - name: Retain machine-readable qualification timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-timing-${{ matrix.target }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-timing
          if-no-files-found: warn
          retention-days: 7
  units:
    name: unit ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.units) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
      - name: Run exact canonical unit shard
        env:
          UNIT_SHARD: ${{ matrix.shard }}
          RIVERHOG_CI_TIMING_DIR: ${{ runner.temp }}/ci-timing
        run: mise x -- uv run --locked --all-packages --group dev python scripts/ci_timing.py run --lane "unit-$UNIT_SHARD"
          --output "$RIVERHOG_CI_TIMING_DIR/unit-$UNIT_SHARD/lane.json" -- make unit-shard UNIT_SHARD="$UNIT_SHARD"
      - name: Retain unit coverage and fixture timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-timing-unit-${{ matrix.shard }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-timing
          if-no-files-found: warn
          retention-days: 7
  compose:
    name: compose ${{ matrix.lane }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.compose) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
      - name: Configure Docker engine
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1
        with:
          version: v29.3.1
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Install Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2
        with:
          version: v5.1.1
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          version: v0.36.0
          driver: docker
      - name: Resolve image metadata
        id: image-metadata
        run: |
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build exact lifecycle images from target-scoped caches
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.targets }}
          load: true
          set: |
            *.args.SOURCE_REVISION=${{ inputs.ref || github.sha }}
            *.args.BUILD_CREATED=${{ steps.image-metadata.outputs.created }}
            *.args.SOURCE_DATE_EPOCH=0
            *.args.RELEASE_VERSION=development
            ${{ matrix.stage_settings }}
            ${{ matrix.cache_settings }}
      - name: Qualify the complete independent lifecycle
        env:
          COMPOSE_LANE: ${{ matrix.lane }}
          RIVERHOG_CI_IMAGES_PREBUILT: '1'
          RIVERHOG_CI_TIMING_DIR: ${{ runner.temp }}/ci-timing
        run: mise x -- uv run --locked --all-packages --group dev python scripts/ci_timing.py run --lane "compose-$COMPOSE_LANE"
          --output "$RIVERHOG_CI_TIMING_DIR/compose-$COMPOSE_LANE/lane.json" -- make compose-shard COMPOSE_LANE="$COMPOSE_LANE"
      - name: Retain lifecycle phase timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-timing-compose-${{ matrix.lane }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-timing
          if-no-files-found: warn
          retention-days: 7
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
  client-platforms:
    name: client platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MISE_AUTO_INSTALL: '0'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
        with:
          install_args: python uv age
      - name: Qualify native behavior and staged end-user installs
        env:
          GOGURT_FAILURE_EVIDENCE_DIR: ${{ runner.temp }}/gogurt-failure-evidence
        run: mise x python uv age -- uv run --locked --all-packages --group dev python -m scripts.ci_qualification native
      - name: Retain bounded Gogurt lifecycle failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gogurt-lifecycle-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/gogurt-failure-evidence
          if-no-files-found: warn
          retention-days: 14
  images:
    name: images ${{ matrix.group }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
      - name: Configure Docker engine
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1
        with:
          version: v29.3.1
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Install Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2
        with:
          version: v5.1.1
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          version: v0.36.0
          driver: docker
      - name: Resolve image metadata
        id: image-metadata
        run: |
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build exact image group from target-scoped caches
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.targets }}
          load: true
          set: |
            *.args.SOURCE_REVISION=${{ inputs.ref || github.sha }}
            *.args.BUILD_CREATED=${{ steps.image-metadata.outputs.created }}
            *.args.SOURCE_DATE_EPOCH=0
            *.args.RELEASE_VERSION=development
            ${{ matrix.cache_settings }}
      - name: Qualify every selected final image
        env:
          IMAGE_GROUP: ${{ matrix.group }}
          RIVERHOG_CI_IMAGES_PREBUILT: '1'
          RIVERHOG_CI_TIMING_DIR: ${{ runner.temp }}/ci-timing
        run: mise x -- uv run --locked --all-packages --group dev python scripts/ci_timing.py run --lane "images-$IMAGE_GROUP"
          --output "$RIVERHOG_CI_TIMING_DIR/images-$IMAGE_GROUP/lane.json" -- make image-qualification IMAGE_GROUP="$IMAGE_GROUP"
      - name: Retain image qualification timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-timing-images-${{ matrix.group }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-timing
          if-no-files-found: warn
          retention-days: 7
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
