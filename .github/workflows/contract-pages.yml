name: Contract Pages

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact green main commit to publish in the aggregate site.
        required: true
        type: string
      release_tag:
        description: Exact immutable product that requested this aggregate rebuild.
        required: false
        type: string
      release_id:
        description: Immutable GitHub Release ID bound to release_tag.
        required: false
        type: string
      release_manifest_sha256:
        description: Immutable release-manifest asset identity bound to release_tag.
        required: false
        type: string
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: riverhog-pages
  cancel-in-progress: false

jobs:
  readiness:
    name: Select trusted exact-source workflow attempts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      ready: ${{ steps.checks.outputs.ready }}
    steps:
      - name: Require protected main workflow authority
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Resolve exact development source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha }}
        run: |
          source_sha="${REQUESTED_SHA:-$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')}"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Development source must be an exact commit SHA.\n' >&2
            exit 2
          fi
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.source.outputs.sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: python uv
      - name: Require a green commit on main
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" || "$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')" != "$SOURCE_SHA" ]]; then
            printf 'Development source is stale; rebuild from current main.\n' >&2
            exit 2
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          mise x -- uv run --locked --group dev python scripts/workflow_evidence.py checks \
            --source-sha "$SOURCE_SHA" --branch main --workflow ci.yml --workflow codeql.yml \
            --allow-pending --github-output "$GITHUB_OUTPUT"

  build:
    name: Generate development and verify all product versions
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ needs.readiness.outputs.source_sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.readiness.outputs.source_sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Bootstrap browser host libraries
        env:
          MISE_EXPERIMENTAL: "1"
        run: mise bootstrap --yes
      - name: Generate and independently check exact-source contract
        env:
          SOURCE_SHA: ${{ needs.readiness.outputs.source_sha }}
        run: make contract-check args="--source-sha $SOURCE_SHA"
      - name: Install Chromium headless shell
        run: mise x -- uv run --locked --group browser python -m playwright install --only-shell chromium
      - name: Exercise development and version navigation in Chromium
        run: make contract-browser
      - name: Assemble development and every immutable product release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.readiness.outputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
        run: |
          product_args=()
          if [[ -n "$RELEASE_TAG$RELEASE_ID$RELEASE_MANIFEST_SHA256" ]]; then
            product_args=(--release-tag "$RELEASE_TAG" --release-id "$RELEASE_ID" \
              --release-manifest-sha256 "$RELEASE_MANIFEST_SHA256")
          fi
          mise x -- uv run --locked --group dev python scripts/contract_pages.py \
            --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/riverhog-pages" "${product_args[@]}"
          mkdir "$RUNNER_TEMP/pages-inputs"
          cp "$RUNNER_TEMP/riverhog-pages/site-manifest.json" "$RUNNER_TEMP/pages-inputs/"
      - name: Retain aggregate input manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-inputs
          path: ${{ runner.temp }}/pages-inputs
          if-no-files-found: error
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/riverhog-pages

  deploy:
    name: Publish verified aggregate site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://nashspence.github.io/riverhog/
    steps:
      - name: Check out exact site coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.source_sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: python uv
      - name: Recheck main and complete product inputs before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
            --name pages-inputs --dir "$RUNNER_TEMP/pages-inputs"
          mise x -- uv run --locked --group dev python scripts/contract_pages.py \
            --check-fresh "$RUNNER_TEMP/pages-inputs/site-manifest.json"
      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
