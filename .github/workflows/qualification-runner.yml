name: Qualification runner image
'on':
  pull_request:
    paths:
      - tools/linux-qualification/**
      - .github/workflows/qualification-runner.yml
  push:
    branches: [main]
    paths:
      - tools/linux-qualification/**
      - .github/workflows/qualification-runner.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          version: v0.36.0
      - name: Build the bootstrap image
        run: docker buildx build --load --tag riverhog-linux-qualification:dev tools/linux-qualification
      - name: Verify unprivileged image contents without network or a daemon socket
        run: |
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --user=1000:1000 --entrypoint=/usr/local/libexec/riverhog-qualification-check \
            riverhog-linux-qualification:dev
      - name: Install the checkout's locked tools as the unprivileged user
        run: |
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
            --user=1000:1000 --mount "type=bind,src=$PWD,dst=/source,readonly" \
            --workdir=/source --entrypoint=/bin/bash riverhog-linux-qualification:dev \
            -euc 'mise trust; mise install --locked; mise x -- python --version; mise x -- uv --version; make help'
