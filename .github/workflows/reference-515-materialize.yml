name: Materialize external reference 515

on:
  push:
    branches:
      - reference/external/515-gogurt-deterministic-ci
    paths:
      - .reference/transport/**

permissions:
  contents: read

jobs:
  materialize:
    if: github.ref == 'refs/heads/reference/external/515-gogurt-deterministic-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact transport checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Apply checksum-bound external implementation
        run: |
          python3 - <<'PY'
          import gzip, hashlib, pathlib, subprocess
          parts = [pathlib.Path('.reference/transport/patch.00'), pathlib.Path('.reference/transport/patch.01')]
          compressed = b''.join(path.read_bytes() for path in parts)
          assert len(compressed) == 14364
          patch = gzip.decompress(compressed)
          assert len(patch) == 57669
          assert hashlib.sha256(patch).hexdigest() == 'f7e9217f0dfe710ccde0f4a9688532fc552d70458b4fc6841851b903c236c64c'
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          expected = {
              'conftest.py',
              'scripts/gogurt_pytest_evidence.py',
              'scripts/qualify_installation.py',
              'some-implementations/gogurt/application/tests/test_listener.py',
              'some-implementations/gogurt/application/tests/test_windows_process_proof.py',
              'some-implementations/gogurt/listener-host/windows/src/a_gogurt_windows_listener/__init__.py',
              'tests/unit/test_github_actions.py',
              'tests/unit/test_gogurt_pytest_evidence.py',
              'tests/unit/test_qualify_installation.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          assert changed == expected, changed
          subprocess.run(['git', 'rm', '--', *map(str, parts)], check=True)
          PY
      - name: Install repository toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Verify locked lint gate on materialized tree
        run: make lint
      - name: Verify focused regressions on materialized tree
        id: focused
        env:
          GOGURT_TEST_EVIDENCE_DIR: ${{ runner.temp }}/reference-preflight-evidence
          GOGURT_CI_SOURCE_SHA: ${{ github.sha }}
        run: >-
          mise x -- uv run --locked --all-packages --group dev
          python -m pytest -q some-implementations/gogurt/application/tests
          tests/unit/test_gogurt_pytest_evidence.py tests/unit/test_qualify_installation.py
          tests/unit/test_github_actions.py
      - name: Publish only the non-authoritative reference branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'reference-515: materialize externally produced Gogurt foundation' -m 'Producer: OpenAI ChatGPT / GPT-6 Astra Pro. Mechanical publication only; this is not release or integration acceptance. See .reference/HANDOFF.md and owning issue #515 under #903.'
          git -c credential.helper= -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:refs/heads/reference/external/515-gogurt-deterministic-ci
      - name: Retain preflight failure evidence
        if: failure() && steps.focused.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-515-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/reference-preflight-evidence
          if-no-files-found: error
          retention-days: 14
