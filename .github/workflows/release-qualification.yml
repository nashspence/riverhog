name: Release qualification

on:
  schedule:
    - cron: "17 7 1,15 * *"
  workflow_dispatch:
    inputs:
      ref:
        description: main, release/v1, or an exact v1 release tag
        default: main
        required: true
        type: string
      version:
        description: Coordinated 1.x.y version to exercise
        default: 1.0.0
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read

concurrency:
  group: release-qualification-${{ github.event_name }}-${{ inputs.ref || 'scheduled' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve exact source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      mode: ${{ steps.source.outputs.mode }}
    steps:
      - name: Check out workflow authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the selected ref once
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.ref }}
          REQUESTED_VERSION: ${{ inputs.version }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != refs/heads/main ]]; then
            printf 'Release qualification workflow authority must be main: %s\n' "$WORKFLOW_REF" >&2
            exit 2
          fi
          ref="$REQUESTED_REF"
          version="$REQUESTED_VERSION"
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            ref=main
            version=1.0.0
            latest_published_tag="$({
              gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
                --jq '.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v1\\.[0-9]+\\.[0-9]+$"))) | .tag_name'
            } | sort -V | tail -n 1)"
            if [[ -n "$latest_published_tag" ]]; then
              ref="$latest_published_tag"
              version="${latest_published_tag#v}"
            elif git ls-remote --exit-code --heads origin release/v1 >/dev/null; then
              ref=release/v1
            fi
          fi
          if [[ ! "$ref" =~ ^(main|release/v1|v1\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$ ]]; then
            printf 'Unsupported qualification ref: %s\n' "$ref" >&2
            exit 2
          fi
          if [[ ! "$version" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Unsupported qualification version: %s\n' "$version" >&2
            exit 2
          fi
          if [[ "$ref" =~ ^v(1\.[0-9]+\.[0-9]+)-rc\.[0-9]+$ \
            && "${BASH_REMATCH[1]}" != "$version" ]]; then
            printf 'Release-candidate qualification ref and version differ: %s %s\n' \
              "$ref" "$version" >&2
            exit 2
          fi
          mode=prospective
          if [[ "$ref" =~ ^v1\.[0-9]+\.[0-9]+$ ]]; then
            mode=historical
            if [[ "$ref" != "v$version" ]]; then
              printf 'Historical qualification ref and version differ: %s %s\n' \
                "$ref" "$version" >&2
              exit 2
            fi
            release="$(gh api "repos/${{ github.repository }}/releases/tags/$ref")"
            jq --exit-status --arg tag "$ref" \
              '.draft == false and .prerelease == false and .tag_name == $tag' \
              <<< "$release" >/dev/null
          fi
          git fetch --force --no-tags origin "$ref"
          sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          printf 'ref=%s\nsha=%s\nversion=%s\nmode=%s\n' \
            "$ref" "$sha" "$version" "$mode" >> "$GITHUB_OUTPUT"
      - name: Verify exact-source CodeQL checks
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          checks="$(gh api "repos/${{ github.repository }}/commits/$SOURCE_SHA/check-runs?per_page=100")"
          for context in 'Analyze (actions)' 'Analyze (python)'; do
            jq --exit-status --arg context "$context" \
              '[.check_runs[] | select(.name == $context and .app.id == 15368 and .conclusion == "success")] | length == 1' \
              <<< "$checks"
          done

  ci:
    name: required checks
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read

  release-audit:
    name: exact-SHA nonpublishing release audit
    needs:
      - resolve
      - ci
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      SOURCE_REF: ${{ needs.resolve.outputs.ref }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      QUALIFICATION_MODE: ${{ needs.resolve.outputs.mode }}
      RIVERHOG_RELEASE_GHA_CACHE: "true"
    steps:
      - name: Check out workflow authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out verified exact source
        run: |
          git fetch --force --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse --verify HEAD)" = "$SOURCE_SHA"
      - name: Install repository toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Configure Docker engine
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.3.1
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.0
          driver: docker
      - name: Locate qualification evidence outside the source tree
        run: |
          qualification_dir="$RUNNER_TEMP/release-qualification"
          printf 'QUALIFICATION_DIR=%s\n' "$qualification_dir" >> "$GITHUB_ENV"
          printf 'RELEASE_SUMMARY=%s/release.json\n' "$qualification_dir" >> "$GITHUB_ENV"
          printf 'GOVERNANCE_SUMMARY=%s/governance.json\n' "$qualification_dir" >> "$GITHUB_ENV"
          printf 'OPERATIONS_SUMMARY=%s/operations.json\n' "$qualification_dir" >> "$GITHUB_ENV"
          printf 'OPERATIONS_TIMINGS=%s/operation-timings.json\n' "$qualification_dir" >> "$GITHUB_ENV"
          printf 'DATABASE_SUMMARY=%s/database.json\n' "$qualification_dir" >> "$GITHUB_ENV"
          printf 'RELEASE_HISTORY_DIR=%s/v1-release-history\n' "$qualification_dir" >> "$GITHUB_ENV"
          printf 'RELEASE_EXPECTED_MANIFEST=%s/v1-release-history/published-candidate.json\n' \
            "$qualification_dir" >> "$GITHUB_ENV"
      - name: Stage immutable v1 release-manifest history
        run: |
          mkdir -p "$RELEASE_HISTORY_DIR"
          candidate_tag="v$RELEASE_VERSION"
          previous_tag=
          mapfile -t published_tags < <(
            gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v1\\.[0-9]+\\.[0-9]+$"))) | .tag_name' \
              | sort -V
          )
          if [[ "$QUALIFICATION_MODE" == "prospective" ]]; then
            if [[ "${#published_tags[@]}" -eq 0 ]]; then
              if [[ "$RELEASE_VERSION" != "1.0.0" ]]; then
                printf 'No immutable predecessor exists for %s.\n' "$candidate_tag" >&2
                exit 2
              fi
            else
              head_index=$((${#published_tags[@]} - 1))
              current_head="${published_tags[$head_index]}"
              greatest="$(printf '%s\n%s\n' "$current_head" "$candidate_tag" | sort -V | tail -n 1)"
              if [[ "$candidate_tag" == "$current_head" || "$greatest" != "$candidate_tag" ]]; then
                printf 'Prospective candidate %s does not follow current v1 head %s.\n' \
                  "$candidate_tag" "$current_head" >&2
                exit 2
              fi
            fi
          elif [[ "$QUALIFICATION_MODE" != "historical" ]]; then
            printf 'Unknown release qualification mode: %s\n' "$QUALIFICATION_MODE" >&2
            exit 2
          fi

          historical_candidate=
          for tag in "${published_tags[@]}"; do
            first="$(printf '%s\n%s\n' "$tag" "$candidate_tag" | sort -V | head -n 1)"
            if [[ "$QUALIFICATION_MODE" == "historical" && "$first" != "$tag" ]]; then
              continue
            fi
            release="$(gh api "repos/${{ github.repository }}/releases/tags/$tag")"
            mapfile -t asset_ids < <(
              jq -r '.assets[] | select(.name == "release-manifest.json") | .id' <<< "$release"
            )
            if [[ "${#asset_ids[@]}" -ne 1 ]]; then
              printf 'Release %s lacks one immutable release-manifest.json asset.\n' "$tag" >&2
              exit 2
            fi
            if [[ "$tag" == "$candidate_tag" ]]; then
              manifest="$RELEASE_HISTORY_DIR/published-candidate.json"
              historical_candidate="$manifest"
            else
              manifest="$RELEASE_HISTORY_DIR/$tag.json"
            fi
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/${{ github.repository }}/releases/assets/${asset_ids[0]}" > "$manifest"
            jq --exit-status --arg tag "$tag" \
              '.schema == "riverhog-release/v1" and .tag == $tag' "$manifest" >/dev/null
            canonical="$manifest.canonical"
            mise x -- python -m json.tool --sort-keys --indent 2 "$manifest" "$canonical"
            cmp --silent "$manifest" "$canonical"
            rm "$canonical"
            if [[ "$tag" != "$candidate_tag" ]]; then
              previous_tag="$tag"
            fi
          done

          if [[ "$QUALIFICATION_MODE" == "historical" ]]; then
            if [[ -z "$historical_candidate" ]]; then
              printf 'Historical release is not published: %s.\n' "$candidate_tag" >&2
              exit 2
            fi
            jq --exit-status --arg tag "$candidate_tag" --arg version "$RELEASE_VERSION" \
              --arg sha "$SOURCE_SHA" \
              '.tag == $tag and .version == $version and .source_sha == $sha' \
              "$historical_candidate" >/dev/null
            history_kind="$(jq -r '.v1_history.kind' "$historical_candidate")"
            if [[ "$history_kind" == "genesis" ]]; then
              if [[ "$RELEASE_VERSION" != "1.0.0" || -n "$previous_tag" ]]; then
                printf 'Historical genesis is not exact v1.0.0.\n' >&2
                exit 2
              fi
              previous_tag=
            elif [[ "$history_kind" == "continuation" ]]; then
              previous_tag="$(jq -r '.v1_history.previous_tag' "$historical_candidate")"
              RELEASE_PREVIOUS_MANIFEST_SHA256="$(
                jq -r '.v1_history.previous_manifest_sha256' "$historical_candidate"
              )"
            else
              printf 'Historical release has an invalid v1 history declaration.\n' >&2
              exit 2
            fi
          fi

          if [[ -n "$previous_tag" ]]; then
            previous_manifest="$RELEASE_HISTORY_DIR/$previous_tag.json"
            if [[ ! -f "$previous_manifest" ]]; then
              printf 'Immediate predecessor is unavailable: %s.\n' "$previous_tag" >&2
              exit 2
            fi
            printf 'RELEASE_PREVIOUS_TAG=%s\n' "$previous_tag" >> "$GITHUB_ENV"
            observed_previous_sha256="$(sha256sum "$previous_manifest" | cut -d ' ' -f 1)"
            if [[ "$QUALIFICATION_MODE" == "historical" \
              && "$RELEASE_PREVIOUS_MANIFEST_SHA256" != "$observed_previous_sha256" ]]; then
              printf 'Historical predecessor digest differs at %s.\n' "$previous_tag" >&2
              exit 2
            fi
            printf 'RELEASE_PREVIOUS_MANIFEST_SHA256=%s\n' \
              "$observed_previous_sha256" >> "$GITHUB_ENV"
          fi
      - name: Exercise disposable operation lifecycles and record timings
        env:
          RIVERHOG_OPERATION_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          RIVERHOG_OPERATION_TIMINGS: ${{ env.OPERATIONS_TIMINGS }}
        run: >-
          make unit
          TESTS="tests/unit/test_operation_lifecycle_api.py::test_riverhog_official_client_positive_disposable_lifecycle
          tests/unit/test_event_cursor_restart.py
          reference/stove0/application/tests/test_stove0_api_parity.py::test_stove0_official_client_positive_disposable_lifecycle
          reference/stove0/application/tests/test_stove0_api_parity.py::test_target_callback_surface_has_one_current_target_client_and_real_api_witness
          reference/riverhog/ingress/ftp/tests/test_ftp_adapter_api_parity.py::test_official_client_positive_disposable_lifecycle
          tests/unit/test_collection_reads.py::test_collection_list_query_count_is_independent_of_page_rows
          reference/stove0/application/tests/test_work_state.py::test_unified_state_store_is_restart_safe_and_compare_and_swap
          reference/stove0/application/tests/test_preview_and_evaluation.py::test_unified_evaluation_store_is_restart_safe
          reference/stove0/application/tests/test_scheduler_roles.py::test_scheduler_uses_bounded_keyset_scans_and_rotates_past_a_permanent_noop
          reference/riverhog/ingress/ftp/tests/test_ftp_adapter_custody.py::test_landing_adapter_reconciles_lost_response_without_releasing_custody
          reference/riverhog/ingress/ftp/tests/test_ftp_adapter_custody.py::test_explicit_flush_is_the_same_bounded_claim_and_receipt_path
          tests/unit/test_cli_*.py
          tests/unit/test_local_materialization.py
          reference/stove0/application/tests/test_cli.py
          reference/riverhog/ingress/ftp/tests/test_ftp_adapter_api_parity.py::test_operator_cli_has_human_and_json_views_for_each_management_operation"
          args="-p tests.operation_observer"
      - name: Verify and record the complete operation matrix
        run: |
          make operation-qualification \
            args="evidence --source-sha $SOURCE_SHA --timings $OPERATIONS_TIMINGS --output $OPERATIONS_SUMMARY"
          cat "$OPERATIONS_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify exact-SHA operation evidence
        run: |
          jq --exit-status \
            --arg sha "$SOURCE_SHA" \
            --arg contract "$(sha256sum qualification/contracts/riverhog-v1.json | cut -d ' ' -f 1)" \
            --slurpfile freeze qualification/contracts/riverhog-v1.json '
            $freeze[0].projection.external_contract.extents.sha256 as $extent
            | ($extent | test("^[0-9a-f]{64}$"))
            and .schema == "riverhog-operation-qualification/v1"
            and .source_sha == $sha
            and .summary.operations == (.operations | length)
            and .qualification.extent_contract.status == "passed"
            and .qualification.extent_contract.schema == "riverhog-contract-machine-closure/v1"
            and .qualification.extent_contract.extent_schema == "riverhog-extent-contract/v1"
            and .qualification.extent_contract.extent_decisions > 0
            and .qualification.extent_contract.projection_sha256 == $contract
            and .qualification.extent_contract.extent_sha256 == $extent
            and .qualification.positive_local_lifecycles.status == "passed"
            and .qualification.cli_human_json_projection.status == "passed"
            and .qualification.bounded_state_access.status == "passed"
            and .qualification.event_cursor_restart_resume.status == "passed"
            and .qualification.provider_backed_lifecycles.status == "linked"
            and .performance.local_api.schema == "riverhog-operation-timings/v1"
            and .performance.local_api.source_sha == $sha
            and (.summary.applications | keys == ["riverhog", "riverhog-ftp-adapter", "stove0"])
            and (.summary.classifications | keys == [
              "client-only-primitive",
              "human-cli+json",
              "standard-tool/protocol"
            ])
          ' "$OPERATIONS_SUMMARY"
      - name: Qualify exact database schemas, selectors, and bounded pages
        run: >-
          make database-qualification
          DATABASE_QUALIFICATION_SOURCE_SHA="$SOURCE_SHA"
          DATABASE_QUALIFICATION_OUTPUT="$DATABASE_SUMMARY"
      - name: Verify exact-SHA database evidence
        run: |
          jq --exit-status --arg sha "$SOURCE_SHA" '
            . as $root
            | .schema == "riverhog-database-qualification/v1"
            and .source_sha == $sha
            and .cardinalities == [4096, 65536]
            and .selector_contract.applications == ["riverhog", "stove0"]
            and .selector_contract.operations > 0
            and .selector_contract.statement_families > 0
            and .selector_contract.plan_cases > .selector_contract.operations
            and (.schema_fixtures.riverhog | test("^[0-9a-f]{64}$"))
            and (.schema_fixtures.stove0 | test("^[0-9a-f]{64}$"))
            and .qualification == {
              exact_schemas: "passed",
              natural_plans: "passed",
              bounded_pages: "passed",
              bounded_page_streams: "passed",
              official_client_bounded_pages: "passed",
              high_fanout_inventory: "passed",
              cancellation: "passed",
              backpressure: "passed",
              restart: "passed",
              digest_invariants: "passed",
              unicode_semantics: "passed",
              postgresql_capabilities: "passed"
            }
            and (.measurements | length) == 2
            and all(.measurements[]; (.plans | length) == $root.selector_contract.plan_cases)
            and all(.measurements[];
              (.page_streams | length) == $root.selector_contract.statement_families)
            and all(.measurements[].page_streams[];
              .chunk_rows == 100
              and .rows <= (.chunk_rows + 1)
              and .peak_application_bytes
                <= $root.page_stream_contract.max_peak_application_bytes
              and .cancellation.cursor_closed
              and .cancellation.connection_reusable)
          ' "$DATABASE_SUMMARY"
      - name: Verify live release governance
        run: >-
          make release-governance-check
          RELEASE_GOVERNANCE_SCOPE=actions-observable
          RELEASE_SUMMARY="$GOVERNANCE_SUMMARY"
      - name: Build and verify release evidence
        run: |
          history_args=()
          if [[ -n "$RELEASE_PREVIOUS_TAG" ]]; then
            history_args+=(
              --previous-tag "$RELEASE_PREVIOUS_TAG"
              --previous-manifest-sha256 "$RELEASE_PREVIOUS_MANIFEST_SHA256"
            )
            while IFS= read -r manifest; do
              history_args+=(--history-manifest "$manifest")
            done < <(find "$RELEASE_HISTORY_DIR" -maxdepth 1 -type f -name 'v1.*.json' | sort -Vr)
          fi
          if [[ "$QUALIFICATION_MODE" == "historical" ]]; then
            history_args+=(--expected-release-manifest "$RELEASE_EXPECTED_MANIFEST")
          fi
          mise x -- uv run --locked --all-packages --group dev \
            python scripts/release.py dry-run \
            --version "$RELEASE_VERSION" \
            --summary "$RELEASE_SUMMARY" \
            "${history_args[@]}"
      - name: Verify exact-SHA nonpublication summary
        run: |
          jq --exit-status --arg sha "$SOURCE_SHA" \
            '.source_sha == $sha
              and .published == false
              and .signature_verified == true
              and .license_coordinates > 0
              and .release_history_manifests > 0' \
            "$RELEASE_SUMMARY"
          jq --exit-status --arg sha "$SOURCE_SHA" \
            '.source_sha == $sha
              and .scope == "actions-observable"
              and .immutable_releases == "operator-preflight-required"' \
            "$GOVERNANCE_SUMMARY"
      - name: Record the completed qualification
        run: |
          jq --exit-status --null-input \
            --slurpfile freeze qualification/contracts/riverhog-v1.json \
            --arg ref "$SOURCE_REF" \
            --arg qualification_mode "$QUALIFICATION_MODE" \
            --arg sha "$SOURCE_SHA" \
            --arg version "$RELEASE_VERSION" \
            --arg contract_projection_sha256 "$(sha256sum qualification/contracts/riverhog-v1.json | cut -d ' ' -f 1)" \
            --arg operation_evidence_sha256 "$(sha256sum "$OPERATIONS_SUMMARY" | cut -d ' ' -f 1)" \
            --arg database_evidence_sha256 "$(sha256sum "$DATABASE_SUMMARY" | cut -d ' ' -f 1)" \
            --arg release_evidence_sha256 "$(sha256sum "$RELEASE_SUMMARY" | cut -d ' ' -f 1)" \
            '{
              schema: "riverhog-release-qualification/v1",
              ref: $ref,
              qualification_mode: $qualification_mode,
              source_sha: $sha,
              version: $version,
              contract_projection_sha256: $contract_projection_sha256,
              contract_trace_sha256: $freeze[0].identities.trace_sha256,
              extent_contract_sha256: $freeze[0].projection.external_contract.extents.sha256,
              operation_evidence_sha256: $operation_evidence_sha256,
              database_evidence_sha256: $database_evidence_sha256,
              release_evidence_sha256: $release_evidence_sha256,
              required_checks: "passed",
              operation_matrix: "passed",
              database_contract: "passed",
              github_governance: "actions-observable-passed",
              release_evidence: "passed",
              published: false
            }
            | select(.contract_trace_sha256 | test("^[0-9a-f]{64}$"))
            | select(.extent_contract_sha256 | test("^[0-9a-f]{64}$"))
            ' > "$QUALIFICATION_DIR/qualification.json"
      - name: Upload SHA-bound summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-qualification-${{ needs.resolve.outputs.sha }}
          path: |
            ${{ runner.temp }}/release-qualification/*.json
            ${{ runner.temp }}/release-qualification/*.md
          if-no-files-found: error
          retention-days: 30
