name: Contract comparison

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Exact source base or target tip for comparison.
        required: true
        type: string
      head:
        description: Exact source head for comparison.
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: Compare independently generated contract values
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.head || github.event.pull_request.head.sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Generate each revision in its own locked environment
        env:
          BASE_REVISION: ${{ inputs.base || github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ inputs.head || github.event.pull_request.head.sha }}
        run: |
          mise x -- uv run --locked --all-packages --group dev python scripts/contract_candidate.py diff \
            --base "$BASE_REVISION" --head "$HEAD_REVISION" --base-mode merge-base \
            --output "$RUNNER_TEMP/contract-review"
          cat "$RUNNER_TEMP/contract-review/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded summary and complete comparison report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-comparison-${{ github.run_id }}
          path: ${{ runner.temp }}/contract-review
          if-no-files-found: error
          retention-days: 30
