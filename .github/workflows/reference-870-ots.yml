# SPDX-License-Identifier: Apache-2.0
name: Reference 870 OTS (non-authoritative)
on:
  push:
    branches: [reference/external/870-ots-proof-lifecycle]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    if: github.ref == 'refs/heads/reference/external/870-ots-proof-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Isolated reference dependencies
        run: |
          python3 -m venv /tmp/ots-reference-venv
          /tmp/ots-reference-venv/bin/pip install -r .reference/ots/requirements.txt
      - name: Compile and deterministic offline tests
        run: |
          /tmp/ots-reference-venv/bin/python -m compileall -q .reference/ots
          /tmp/ots-reference-venv/bin/python -m pytest -c .reference/ots/pyproject.toml .reference/ots -q
