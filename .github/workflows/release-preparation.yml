name: Release preparation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact qualified code commit; preparation does not create a tag or release.
        required: true
        type: string
      version:
        description: Coordinated v1 product version.
        required: true
        type: string
      documentation_commit:
        description: Exact independent authored documentation commit for this version.
        required: true
        type: string
      qualification_run:
        description: Successful exact-source release-qualification run ID.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Build reviewable source-bound artifact set
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact qualified code and authoring history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
      - name: Install repository toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Configure Docker engine
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.3.1
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
          driver: docker
      - name: Prepare complete contract, documentation and release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          DOCUMENTATION_COMMIT: ${{ inputs.documentation_commit }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mise x -- uv run --locked --all-packages --group dev python scripts/release.py prepare \
            --version "$RELEASE_VERSION" --documentation-commit "$DOCUMENTATION_COMMIT" \
            --qualification-run "$QUALIFICATION_RUN" \
            --output "$RUNNER_TEMP/release-preparation/evidence" \
            --summary "$RUNNER_TEMP/release-preparation/summary.json"
      - name: Retain complete reviewable preparation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preparation-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-preparation
          if-no-files-found: error
          retention-days: 30
